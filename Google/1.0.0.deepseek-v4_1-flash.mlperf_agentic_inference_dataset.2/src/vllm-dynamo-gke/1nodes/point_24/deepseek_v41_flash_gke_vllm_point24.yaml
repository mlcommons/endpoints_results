  - name: DSV41_RUN_WITH_ENV
    uri: <workdir>
    content: |
      """Render flat server settings or role-specific Dynamo YAML as shell exports."""
      import os, shlex, sys
      from pathlib import Path
      import yaml

      role, *paths = sys.argv[1:]
      if role not in ("frontend", "worker"):
          raise ValueError("Expected frontend or worker")
      settings = {}
      for path in paths:
          data = yaml.safe_load(Path(path).read_text())
          if "common" in data:
              data = {**data["common"], **data[role]}
          settings.update(data)
      for key, value in settings.items():
          if not key.isidentifier():
              raise ValueError(f"Invalid environment name: {key}")
          # Preserve the source overlay order without adding cwd when PYTHONPATH is unset.
          inherited = os.environ.get("PYTHONPATH", "")
          value = str(value).replace(":${PYTHONPATH}", ":" + inherited if inherited else "")
          value = os.path.expandvars(value)
          if "${" in value:
              raise ValueError(f"Unresolved environment value for {key}: {value}")
          print(f"export {key}={shlex.quote(value)}")
  - name: CPUSET_PY
    uri: <workdir>
    content: |
      #!/usr/bin/env python3
      """CPU sets that keep the engine processes off the frontend's cores.

      usage: cpuset.py worker <rank> <cores_per_rank> <num_ranks>
             cpuset.py frontend <cores_per_rank> <num_ranks>
      Rank r drives GPU r (one node, GPUs 0..num_ranks-1). Each rank gets <cores_per_rank> physical cores on its GPU's
      NUMA node, both SMT siblings included, taken in order after the cores of lower ranks on the same node. Core 0 of
      each node is skipped (housekeeping/interrupts). `frontend` prints every online CPU that no rank owns.
      Output is a taskset/numactl CPU list, e.g. "1-12,177-188".
      """
      import re
      import subprocess
      import sys


      def read(path):
          with open(path) as f:
              return f.read().strip()


      def parse_list(s):
          out = []
          for part in s.split(","):
              if not part:
                  continue
              a, _, b = part.partition("-")
              out.extend(range(int(a), int(b or a) + 1))
          return out


      def fmt_list(cpus):
          cpus = sorted(set(cpus))
          runs, start = [], None
          for i, c in enumerate(cpus):
              if start is None:
                  start = c
              if i + 1 == len(cpus) or cpus[i + 1] != c + 1:
                  runs.append(f"{start}-{c}" if c != start else f"{c}")
                  start = None
          return ",".join(runs)


      def gpu_numa_nodes(n):
          topo = subprocess.run(["nvidia-smi", "topo", "-m"], capture_output=True, text=True, check=True).stdout
          topo = re.sub(r"\x1b\[[0-9;]*m", "", topo).splitlines()
          nodes = {}
          for line in topo[1:]:
              f = line.split()
              if f and re.fullmatch(r"GPU\d+", f[0]) and int(f[0][3:]) < n:
                  nodes[int(f[0][3:])] = int(f[-2])
          return [nodes[g] for g in range(n)]


      def physical_cores(node):
          # First thread of each core on the node, in CPU order.
          seen, cores = set(), []
          for c in parse_list(read(f"/sys/devices/system/node/node{node}/cpulist")):
              sib = tuple(parse_list(read(f"/sys/devices/system/cpu/cpu{c}/topology/thread_siblings_list")))
              if sib not in seen:
                  seen.add(sib)
                  cores.append(sib)
          return cores


      def rank_sets(k, n):
          nodes = gpu_numa_nodes(n)
          sets = []
          for r in range(n):
              slot = sum(1 for q in range(r) if nodes[q] == nodes[r])
              cores = physical_cores(nodes[r])[1:]
              chosen = cores[slot * k:(slot + 1) * k]
              if len(chosen) < k:
                  sys.exit(f"node {nodes[r]} has too few cores for rank {r}")
              sets.append([c for sib in chosen for c in sib])
          return sets


      if sys.argv[1] == "worker":
          r, k, n = map(int, sys.argv[2:5])
          print(fmt_list(rank_sets(k, n)[r]))
      elif sys.argv[1] == "frontend":
          k, n = map(int, sys.argv[2:4])
          owned = {c for s in rank_sets(k, n) for c in s}
          print(fmt_list(c for c in parse_list(read("/sys/devices/system/cpu/online")) if c not in owned))
      else:
          sys.exit(__doc__)
  - name: RUN_WITH_ENV
    uri: <workdir>
    content: |
      #!/usr/bin/env python3
      """
      Print shell export statements from one or more flat YAML env files.

      Usage:
          eval "$(python3 run_with_env.py <env.yaml> [<overlay.yaml> ...] | tee /dev/stderr)"

      Files are merged in order, so a later file overrides keys of an earlier one: a point's
      server-env.yaml followed by an optional site overlay (NVIDIA/src/sflow/site/*.yaml).
      Empty arguments are skipped, so an unset overlay variable expands to nothing harmlessly.

      The tee /dev/stderr makes each export line visible in the log,
      while eval applies them to the current shell.
      """
      import argparse
      import os
      import shlex
      import sys

      import yaml


      def parse_args() -> argparse.Namespace:
          p = argparse.ArgumentParser(description=__doc__, formatter_class=argparse.RawDescriptionHelpFormatter)
          p.add_argument("env_yaml", nargs="+",
                         help="Flat YAML files of KEY: value env vars; later files override earlier ones")
          return p.parse_args()


      def load_env(paths: list[str]) -> dict:
          """Merge the env files in order; a later file's keys win. Empty paths are skipped."""
          merged: dict = {}
          for path in paths:
              if not path:
                  continue
              with open(path) as f:
                  merged.update(yaml.safe_load(f) or {})
          return merged


      def print_exports(env_vars: dict) -> None:
          """Print 'export KEY=value' lines for each entry in env_vars."""
          for k, v in env_vars.items():
              # Sflow variables are injected into the task process environment.
              expanded = os.path.expandvars(str(v))
              print(f"export {k}={shlex.quote(expanded)}")


      def main() -> None:
          args = parse_args()
          print_exports(load_env(args.env_yaml))


      if __name__ == "__main__":
          main()
  - name: GENERATE_ENDPOINT_YAML
    uri: <workdir>
    content: |
      #!/usr/bin/env python3
      """
      Render endpoint.yaml with a dynamic list of frontend endpoint URLs.

      Reads an existing endpoint.yaml template, replaces ``endpoint_config.endpoints``
      with the provided URL list, and writes the result. Other ``${VAR}`` placeholders
      in the template are preserved verbatim so the endpoints repo's own env-var
      interpolation (resolve_env_vars in inference_endpoint.config.utils) still runs
      at ``benchmark from-config`` load time.

      Usage:
          python3 generate_endpoint_yaml.py \\
              --input  /work/.../endpoint.yaml \\
              --frontend-urls <ip>:8000,<ip>:8000 \\
              --output /tmp/endpoint_resolved.yaml \\
              [--scheme http]

      The comma-separated --frontend-urls form matches generate_master_yaml.py's
      --ctx-urls / --gen-urls convention, so it composes naturally with the
      ``paste -sd ','`` pattern used to flatten the FRONTEND_URLS artifact.
      """
      import argparse
      import sys
      from pathlib import Path

      import yaml


      def parse_args() -> argparse.Namespace:
          p = argparse.ArgumentParser(description=__doc__, formatter_class=argparse.RawDescriptionHelpFormatter)
          p.add_argument("--input", required=True, type=Path,
                         help="Source endpoint.yaml template")
          p.add_argument("--frontend-urls", required=True,
                         help="Comma-separated frontend addresses, e.g. <ip>:8000,<ip>:8000. "
                              "Each entry may include a scheme; otherwise --scheme is prepended.")
          p.add_argument("--output", required=True, type=Path,
                         help="Destination endpoint.yaml")
          p.add_argument("--scheme", default="http", choices=["http", "https"],
                         help="Scheme to prepend to bare ip:port entries (default: http)")
          return p.parse_args()


      def parse_urls(raw: str, scheme: str) -> list[str]:
          """Split CSV, strip blanks, prepend scheme if absent."""
          urls = []
          for entry in raw.split(","):
              e = entry.strip()
              if not e:
                  continue
              if not (e.startswith("http://") or e.startswith("https://")):
                  e = f"{scheme}://{e}"
              urls.append(e)
          if not urls:
              print("ERROR: no URLs provided in --frontend-urls", file=sys.stderr)
              sys.exit(1)
          return urls


      def main() -> None:
          args = parse_args()

          if not args.input.exists():
              print(f"ERROR: input file not found: {args.input}", file=sys.stderr)
              sys.exit(1)

          with open(args.input) as f:
              config = yaml.safe_load(f)

          if not isinstance(config, dict):
              print(f"ERROR: expected YAML mapping at root, got {type(config).__name__}", file=sys.stderr)
              sys.exit(1)

          ep_cfg = config.get("endpoint_config")
          if not isinstance(ep_cfg, dict):
              print("ERROR: input YAML is missing 'endpoint_config' mapping", file=sys.stderr)
              sys.exit(1)

          ep_cfg["endpoints"] = parse_urls(args.frontend_urls, args.scheme)

          args.output.parent.mkdir(parents=True, exist_ok=True)
          with open(args.output, "w") as f:
              yaml.dump(config, f, default_flow_style=False, sort_keys=False)

          print(f"Written: {args.output}")
          print(f"endpoints ({len(ep_cfg['endpoints'])}):")
          for u in ep_cfg["endpoints"]:
              print(f"  - {u}")


      if __name__ == "__main__":
          main()

  # ---- client.yaml: VERBATIM except the documented rewrite(s) -------------
  # GKE REWRITE (guide 5.1):
  #   report_dir: ${SFLOW_TASK_OUTPUT_DIR}/report -> ${REPORT_DIR}
  # ${REPORT_DIR} is a durable hostPath on the node's SSD, exported by
  # endpoint_client (the drop's ${SFLOW_TASK_OUTPUT_DIR} is a pod emptyDir).
  - name: CLIENT_CONFIG
    uri: <workdir>
    content: |
      name: deepseek-v4.1-flash-c24
      version: '1.0'
      type: online
      submission_ref:
        model: deepseek-ai/DeepSeek-V4.1-Flash
        ruleset: mlperf-endpoints-v1.0-2026-10-C1-A
      model_params:
        name: deepseek-ai/DeepSeek-V4.1-Flash
        tokenizer_name: ${MODEL_PATH}
        temperature: 1.0
        top_k: 0
        top_p: 0.95
        max_new_tokens: 8192
        streaming: 'on'
        chat_template_kwargs:
          thinking: true
          reasoning_effort: max
      datasets:
      - name: mlperf_agentic_inference_dataset
        type: performance
        path: ${DATA_PATH}/perf/mlperf_agentic_inference_dataset.jsonl
        accuracy_config:
          eval_method: agentic_inference_inline
        agentic_inference:
          turn_timeout_s: 86400.0
          enable_salt: true
          inject_tool_delay: true
          routing_headers:
          - X-Dynamo-Session-ID
          num_trajectories_to_issue: ${NUM_TRAJECTORIES}
          stop_issuing_on_first_user_complete: false
      - name: swe_bench
        type: accuracy
        accuracy_config:
          eval_method: swe_bench_scorer
          num_repeats: 1
          extras:
            swebench_service_url: http://127.0.0.1:18080
            swebench_service_auth_token: local-swebench-service-token
            subset: verified
            split: test
            num_instances: 200
            workers: 12
            max_eval_workers: 12
            service_timeout_s: 86400
            poll_interval_s: 5
      settings:
        load_pattern:
          type: agentic_inference
          target_concurrency: ${CONCURRENCY}
        client:
          num_workers: 8
          warmup_connections: 0
          min_required_connections: 0
          worker_initialization_timeout: 300.0
        timeouts:
          warmup_drain_timeout_s: null
          performance_drain_timeout_s: null
          metrics_drain_timeout_s: 1800.0
        metrics_tokenizer_workers: 16
        metrics_isl: false
      endpoint_config:
        endpoints: []
        api_type: openai
        api_key: EMPTY
      report_dir: ${REPORT_DIR}

  # ---- NVLink fabric preflight (guide section 7.3; port of the Kimi-K3 check) --
  - name: FABRIC_CHECK
    uri: <workdir>
    content: |
      #!/usr/bin/env python3
      """Fail fast if this node's four GPUs do not report a healthy NVLink fabric.

      kubelet shows a node Ready with 4 allocatable GPUs even when its NVLink
      fabric is broken; nothing else flags it before NCCL fails.  Prints one
      DSV41_FABRIC line per worker so the run can be audited from the logs.
      """
      import os
      import re
      import shutil
      import socket
      import subprocess
      import sys

      def nvidia_smi():
          for cand in (shutil.which("nvidia-smi"), "/usr/local/nvidia/bin/nvidia-smi",
                       "<workdir>/bin/nvidia/bin/nvidia-smi", "/usr/bin/nvidia-smi"):
              if cand and os.access(cand, os.X_OK):
                  return cand
          raise FileNotFoundError("nvidia-smi not found")

      def fabric_identity(text):
          blocks = re.split(r"(?m)^GPU ", text)[1:]
          if len(blocks) != 4:
              raise ValueError("expected 4 GPUs per node, saw %d" % len(blocks))
          ids = []
          for block in blocks:
              if "\n    Fabric\n" not in block:
                  raise ValueError("missing GPU fabric report")
              fabric = block.split("\n    Fabric\n", 1)[1]
              for key, want in (("State", "Completed"), ("Status", "Success"),
                                ("Summary", "Healthy"), ("Bandwidth", "Full")):
                  m = re.search(r"(?m)^\s+" + key + r"\s+:\s*(\S+)", fabric)
                  if not m or m.group(1) != want:
                      raise ValueError("unhealthy or incomplete GPU fabric: %s" % key)
              ident = []
              for key in ("ClusterUUID", "CliqueId"):
                  m = re.search(key + r"\s+:\s*(\S+)", fabric)
                  if not m or m.group(1) == "N/A":
                      raise ValueError("missing fabric identity: %s" % key)
                  ident.append(m.group(1))
              ids.append(ident)
          if any(i != ids[0] for i in ids):
              raise ValueError("node GPUs report different fabric identities")
          return ids[0]

      def main():
          node = os.environ.get("SFLOW_TASK_NODE_NAME") or socket.gethostname().split(".")[0]
          replica = os.environ.get("SFLOW_REPLICA_INDEX", "0")
          strict = os.environ.get("FABRIC_STRICT", "1") == "1"
          try:
              out = subprocess.check_output([nvidia_smi(), "-q"], text=True, timeout=120)
              cluster, clique = fabric_identity(out)
          except Exception as exc:  # noqa: BLE001
              print("DSV41_FABRIC node=%s worker=%s FAILED: %s" % (node, replica, exc), flush=True)
              if strict:
                  print("DSV41_FABRIC ABORTING (FABRIC_STRICT=1): kubectl cordon %s and re-run; "
                        "-s FABRIC_STRICT=0 to continue anyway." % node, flush=True)
                  sys.exit(1)
              print("DSV41_FABRIC warning only (FABRIC_STRICT=0); continuing", flush=True)
              return
          print("DSV41_FABRIC node=%s worker=%s cluster=%s clique=%s gpus=4 healthy=True"
                % (node, replica, cluster, clique), flush=True)

      if __name__ == "__main__":
          main()

  # ---- HOST MOUNTS.  fs:// is a hostPath mount, NOT a fetch. ---------------
  - name: MODEL_CACHE
    uri: fs://${{ variables.MODEL_PATH }}
  - name: MLPERF_DATA
    uri: fs://${{ variables.DATA_PATH }}
  - name: NVIDIA_DRIVER_LIB
    uri: <workdir>/bin/nvidia/lib64
  # Never DirectoryOrCreate (guide F26): a FailedMount here is the expected
  # transient until the ComputeDomain is active.
  - name: IMEX_CHANNELS
    uri: fs:///dev/nvidia-caps-imex-channels
  - name: REPORTS_DIR
    uri: fs://${{ variables.REPORTS_ROOT }}
  - name: RUNTIME_DIR
    uri: fs://${{ variables.RUNTIME_ROOT_HOST }}

operators:
  # Slurm `vllm_container` (srun + Pyxis, VLLM_CONTAINER_IMAGE) -> k8s.  Used by
  # both dynamo_frontend (CPU pod) and vllm_worker (GPU pod), as in the drop.
  # privileged: true allows numactl --membind / taskset and exposes host GPU topo.
  - name: vllm_container
    type: k8s
    image: ${{ variables.VLLM_IMAGE }}
    image_pull_secrets:
      - ${{ variables.IMAGE_PULL_SECRET }}
    shm_size: 64Gi
    run_as_root: true
    security_context:
      privileged: true
  # Slurm `endpoint_container` (ENDPOINT_CONTAINER_IMAGE) -> k8s.
  - name: endpoint_container
    type: k8s
    image: ${{ variables.CLIENT_IMAGE }}
    shm_size: 16Gi
    run_as_root: true

backends:
  - name: k8s_cluster
    type: kubernetes
    default: true
    namespace: ${{ variables.K8S_NAMESPACE }}
    # 1 node = slurm_env.yaml SLURM_NODES.  NVIDIA's native topology; not scaled.
    nodes: ${{ variables.TOTAL_NODES }}
    gpus_per_node: ${{ variables.GPUS_PER_NODE }}
    host_network: true            # pod IP == node IP; frontend URL = node IP
    host_ipc: true                # mounts hostPath /dev/shm so DYN_FILE_KV is shared across pods
    scheduling: device_plugin     # NOT dra on this cluster (guide F20)
    node_selector:
      cloud.google.com/gke-nodepool: ${{ variables.GKE_NODEPOOL }}
    # No NCCL NET traffic exists on one node; `disable` stops NCCL probing the
    # dead RoCE HCAs / loading the HPC-X plugin (guide F3).
    rdma: disable
    # ComputeDomain on a 1-node run.  Not needed for cross-node MNNVL (there is
    # none), but it gives the pod an IMEX channel, which is what the Slurm
    # GB300 NVL72 nodes provide to the job: vLLM/FlashInfer/NCCL can use CUDA
    # fabric (cuMem FABRIC) handles even intra-node, and without a channel
    # those fail with CUDA_ERROR_NOT_PERMITTED (guide F22) rather than falling
    # back.  It also lets the IMEX_CHANNELS mount above resolve.  NO `channel:`.
    compute_domain:
      create: true
    tolerations:
      - {key: "kubernetes.io/arch", operator: "Equal", value: "arm64", effect: "NoSchedule"}
      - {key: "nvidia.com/gpu", operator: "Exists", effect: "NoSchedule"}
    reservation:
      timeout: 1800
    collect_max_file_size: 1Gi    # default 10 MiB silently skips report files (F30)
    collect_grace_seconds: 900

workflow:
  name: dsv41_flash_vllm_endpoint_gke
  variables:
    HEAD_NODE_IP:
      value: "${{ backends.k8s_cluster.nodes[0].ip_address }}"
    FRONTEND_URL:
      value: "http://${{ backends.k8s_cluster.nodes[0].ip_address }}:${{ variables.VLLM_PORT }}"
  tasks:
    # -----------------------------------------------------------------------
    # Dynamo frontend (CPU, node 0).  The drop's script with anchored GKE
    # substitutions only (artifact paths, VLLM_URLS, RUN_ROOT/host_cpus.txt).
    # -----------------------------------------------------------------------
    - name: dynamo_frontend
      resources:
        nodes:
          indices: [0]
      operator:
        name: vllm_container
      script:
        - |
          # ---- GKE preamble (not in the drop) ----
          set -euo pipefail
          if [ -x /opt/venv/bin/python3 ] && /opt/venv/bin/python3 -c 'import dynamo' 2>/dev/null; then
            export PATH="/opt/venv/bin:${PATH}"
          fi
          export PATH="/usr/local/nvidia/bin:<workdir>/bin/nvidia/bin:${PATH}"
          export LD_LIBRARY_PATH="/usr/local/nvidia/lib64:<workdir>/bin/nvidia/lib64:${LD_LIBRARY_PATH:-}"
          RUN_ID="$(basename "${SFLOW_WORKFLOW_OUTPUT_DIR}")"
          RUN_TAG="$(( $(printf '%s' "${RUN_ID}" | cksum | cut -d' ' -f1) % 1000000 ))"
          RUN_ROOT="${{ artifacts.RUNTIME_DIR.path }}/${RUN_ID}"
          mkdir -p "${RUN_ROOT}"
          export SLURM_JOB_ID="${RUN_TAG}"
          rm -rf "/dev/shm/dynamo-discovery-${SLURM_JOB_ID}"
          echo "DSV41_RUNTIME_DIR node=${SFLOW_TASK_NODE_NAME:-$(hostname)} path=${RUN_ROOT} run_tag=${RUN_TAG}"
          # cpuset.py parses `nvidia-smi topo -m` for GPU0..GPU3 CPU/NUMA affinity.
          # If this CPU-only pod cannot query NVML directly, provide a sysfs PCIe
          # fallback so cpuset.py stays byte-identical.
          if ! nvidia-smi topo -m 2>/dev/null | grep -q '^GPU0[[:space:]]'; then
            mkdir -p /tmp/gke-bin
            cat <<'EOF_SMI' > /tmp/gke-bin/nvidia-smi
          #!/usr/bin/env python3
          import glob, os
          gpus = []
          for p in sorted(glob.glob("/sys/bus/pci/devices/*")):
              try:
                  if open(os.path.join(p, "vendor")).read().strip() == "0x10de":
                      cls = open(os.path.join(p, "class")).read().strip()
                      if cls.startswith("0x0302") or cls.startswith("0x0300"):
                          numa = max(0, int(open(os.path.join(p, "numa_node")).read().strip()))
                          cpus = open(f"/sys/devices/system/node/node{numa}/cpulist").read().strip()
                          gpus.append((cpus, numa))
              except Exception:
                  pass
          if len(gpus) < 4:
              n0 = open("/sys/devices/system/node/node0/cpulist").read().strip() if os.path.exists("/sys/devices/system/node/node0/cpulist") else "0-71"
              n1_ok = os.path.exists("/sys/devices/system/node/node1/cpulist")
              n1 = open("/sys/devices/system/node/node1/cpulist").read().strip() if n1_ok else n0
              gpus = [(n0, 0), (n0, 0), (n1, 1 if n1_ok else 0), (n1, 1 if n1_ok else 0)]
          print("\tGPU0\tGPU1\tGPU2\tGPU3\tCPU Affinity\tNUMA Affinity\tGPU NUMA ID")
          for i, (cpus, numa) in enumerate(gpus[:4]):
              row = ["NV18" if j != i else " X " for j in range(4)]
              print(f"GPU{i}\t" + "\t".join(row) + f"\t{cpus}\t{numa}\tN/A")
          EOF_SMI
            chmod +x /tmp/gke-bin/nvidia-smi
            export PATH="/tmp/gke-bin:${PATH}"
          fi
        - |
          set -euo pipefail
          ENV_EXPORTS=$(python3 ${{ artifacts.DSV41_RUN_WITH_ENV.path }} frontend ${{ artifacts.DYNAMO_ENV_YAML.path }} | tee /dev/stderr)
          eval "$ENV_EXPORTS"
          mkdir -p "$DYN_FILE_KV"
          cat ${{ artifacts.VLLM_URLS.path }}  # GKE: static artifact (ConfigMaps are read-only)
          # Reserve 12 physical cores (including SMT siblings) for each worker;
          # frontend 12 4 returns all online CPUs outside the four worker sets.
          # example for one node: FE_CPUS=0,25-88,113-176,201-264,289-351.
          # taskset limits CPU execution across both NUMA nodes, without memory binding.
          FE_CPUS=$(python3 ${{ artifacts.CPUSET_PY.path }} frontend 12 ${{ variables.NUM_WORKERS }})
          echo "$FE_CPUS" > "$RUN_ROOT/host_cpus.txt"
          exec taskset -c "$FE_CPUS" python3 -m dynamo.frontend \
            --discovery-backend file \
            --request-plane tcp \
            --event-plane zmq \
            --router-mode round-robin \
            --router-session-affinity-ttl-secs 3600 \
            --http-host 0.0.0.0 \
            --http-port ${{ variables.VLLM_PORT }}
      probes:
        readiness:
          http_get:
            url: "${{ variables.FRONTEND_URL }}/health"
          timeout: 5400
          interval: 5
        failure:
          log_watch:
            regex_pattern: "re:(panicked at|Rejected incompatible workers)"
          interval: 1
          failure_threshold: 1

    # -----------------------------------------------------------------------
    # dynamo.vllm workers: NUM_WORKERS (4) x GPUS_PER_WORKER (1) on node 0.
    # sflow merges all 4 colocated replicas into a single 4-GPU pod
    # (merge_colocated_gpu_pods); server-env.yaml exports
    # CUDA_VISIBLE_DEVICES="0,1,2,3" and VLLM_DP_RANK_LOCAL_OVERRIDE=$IDX
    # so all 4 GPUs participate in DEP4 (TP1 + DP4 + EP).
    # -----------------------------------------------------------------------
    - name: vllm_worker
      depends_on:
        - dynamo_frontend
      replicas:
        count: ${{ variables.NUM_WORKERS }}
        policy: parallel
      resources:
        nodes:
          indices: [0]
        gpus:
          count: ${{ variables.GPUS_PER_WORKER }}
      operator:
        name: vllm_container
      script:
        - |
          # ---- GKE preamble (not in the drop) ----
          set -euo pipefail
          if [ -x /opt/venv/bin/python3 ] && /opt/venv/bin/python3 -c 'import dynamo' 2>/dev/null; then
            export PATH="/opt/venv/bin:${PATH}"
          fi
          export PATH="/usr/local/nvidia/bin:<workdir>/bin/nvidia/bin:${PATH}"
          export LD_LIBRARY_PATH="/usr/local/nvidia/lib64:<workdir>/bin/nvidia/lib64:${LD_LIBRARY_PATH:-}"
          RUN_ID="$(basename "${SFLOW_WORKFLOW_OUTPUT_DIR}")"
          # SLURM_JOB_ID stand-in: deterministic numeric tag shared with dynamo_frontend
          # for /dev/shm/dynamo-discovery-${SLURM_JOB_ID} and short enough to keep
          # /tmp/dsv41-<id>-w<i>/rpc well under the 107-byte unix sockaddr limit.
          RUN_TAG="$(( $(printf '%s' "${RUN_ID}" | cksum | cut -d' ' -f1) % 1000000 ))"
          RUN_ROOT="${{ artifacts.RUNTIME_DIR.path }}/${RUN_ID}"
          mkdir -p "${RUN_ROOT}"
          export SLURM_JOB_ID="${RUN_TAG}"
          # server-env.yaml expands ${RECIPE_DIR}/.cache/... for persistent and per-job caches.
          export RECIPE_DIR="${{ artifacts.RUNTIME_DIR.path }}"
          mkdir -p "${RECIPE_DIR}/.cache/persist" "${RECIPE_DIR}/.cache/vllm"
          echo "DSV41_RUNTIME_DIR node=${SFLOW_TASK_NODE_NAME:-$(hostname)} path=${RUN_ROOT} run_tag=${RUN_TAG} worker=${SFLOW_REPLICA_INDEX:-0}"
          if [ ! -f "${{ variables.MODEL_PATH }}/config.json" ] || ! ls "${{ variables.MODEL_PATH }}"/*.safetensors >/dev/null 2>&1; then
            echo "FATAL: model not staged at ${{ variables.MODEL_PATH }} -- kubectl apply -f ../../stage-assets.yaml" >&2
            exit 1
          fi
          # ---- NVLink fabric preflight (guide 7.3) ----
          FABRIC_STRICT="${{ variables.FABRIC_STRICT }}" python3 ${{ artifacts.FABRIC_CHECK.path }}
          # ---- GKE compatibility layer (single node, no MPI/UCX/RoCE) ----
          export NCCL_SOCKET_IFNAME=eth0
          export GLOO_SOCKET_IFNAME=eth0
          export TP_SOCKET_IFNAME=eth0
          export NCCL_NET=Socket
          export NCCL_ENV_PLUGIN=none
          export NCCL_NET_PLUGIN=none
          export NCCL_DEBUG=INFO
        - |
          set -euo pipefail
          IDX=$SFLOW_REPLICA_INDEX
          export SLURM_RESTART_COUNT=${SLURM_RESTART_COUNT:-0}
          # One fixed Dynamo system port per rank, below the i16 limit.
          SYSTEM_PORT=$((30000 + IDX))
          ENV_EXPORTS=$(WORKER_SYSTEM_PORT="$SYSTEM_PORT" WORKER_VLLM_PORT="$((20000 + IDX * 100))" \
            python3 ${{ artifacts.DSV41_RUN_WITH_ENV.path }} worker ${{ artifacts.DYNAMO_ENV_YAML.path }} ${{ artifacts.SERVER_ENV_YAML.path }} | tee /dev/stderr)
          eval "$ENV_EXPORTS"
          # Defaults for GB300 points that do not specify persistent cache paths.
          export VLLM_FLASHINFER_AUTOTUNE_CACHE_DIR=${VLLM_FLASHINFER_AUTOTUNE_CACHE_DIR:-${RECIPE_DIR}/.cache/persist/fi_autotune}
          export DG_JIT_CACHE_DIR=${DG_JIT_CACHE_DIR:-${RECIPE_DIR}/.cache/persist/deep_gemm}
          mkdir -p "$XDG_CACHE_HOME" "$PROMETHEUS_MULTIPROC_DIR"
          mkdir -p "$DYN_FILE_KV" "$VLLM_CACHE_ROOT" "$TORCHINDUCTOR_CACHE_DIR" \
            "$VLLM_RPC_BASE_PATH" "$TMPDIR" \
            "$TRITON_CACHE_DIR" "$TILELANG_CACHE_DIR" "$VLLM_FLASHINFER_AUTOTUNE_CACHE_DIR" "$DG_JIT_CACHE_DIR" "$FLASHINFER_WORKSPACE_BASE"
          # Rank IDX drives GPU IDX; read its CPU NUMA Affinity from the GPU row.
          NODE=$(nvidia-smi topo -m | sed 's/\x1b\[[0-9;]*m//g' | awk -v g="GPU$IDX" 'NR>1 && $1==g {print $(NF-1); exit}')
          [[ "$NODE" =~ ^[0-9]+$ ]] || { echo "No NUMA node for GPU$IDX"; exit 1; }
          # Give each rank 12 physical cores with both SMT threads on its GPU's
          # NUMA node. Skip the first physical core; ranks on the same node get
          # consecutive, non-overlapping core groups. CPU IDs come from live topology.
          # examples for one node (Linux logical CPU IDs, 24 threads per rank):
          # GPU0/rank0: NODE=0, W_CPUS=1-12,177-188
          # GPU1/rank1: NODE=0, W_CPUS=13-24,189-200
          # GPU2/rank2: NODE=1, W_CPUS=89-100,265-276
          # GPU3/rank3: NODE=1, W_CPUS=101-112,277-288
          W_CPUS=$(python3 ${{ artifacts.CPUSET_PY.path }} worker "$IDX" 12 ${{ variables.NUM_WORKERS }})
          # Bind execution to W_CPUS and new host-memory allocations to NODE
          # to keep Engram CPU offload local to the GPU's NUMA node.
          exec numactl --physcpubind="$W_CPUS" --membind="$NODE" python3 -m dynamo.vllm \
            ${{ variables.VLLM_ARGS }}
      probes:
        readiness:
          log_watch:
            regex_pattern: "endpoint 'dynamo.backend.generate'"
            match_count: 1
          timeout: 5400
          interval: 10
        failure:
          log_watch:
            regex_pattern: "re:(CUDA out of memory|Engine core initialization failed|Failed to bind to address|System status server startup failed)"
          interval: 1
          failure_threshold: 1

    # -----------------------------------------------------------------------
    # MLCommons Endpoints client (CPU, node 0).  GKE items per guide 5.8, then
    # the drop's endpoint_client script item with anchored substitutions only.
    # -----------------------------------------------------------------------
    - name: endpoint_client
      resources:
        nodes:
          indices: [0]
      operator:
        name: endpoint_container
      depends_on:
        - dynamo_frontend
        - vllm_worker
      script:
        - |
          set -euo pipefail
        # (1) Resolve the client venv BEFORE scrubbing env: containers start with
        #     `bash -l`, which resets PATH and drops /opt/venv/bin (guide F16).
        - |
          CLIENT_VENV="${UV_PROJECT_ENVIRONMENT:-/opt/venv}"
          if [ -x "${CLIENT_VENV}/bin/python3" ]; then
            export PATH="${CLIENT_VENV}/bin:${PATH}"
          fi
          unset PYTHONPATH PYTHONHOME UV_PROJECT_ENVIRONMENT
          echo "client interpreter: $(command -v python3)"
          if ! python3 -c 'import inference_endpoint' 2>/dev/null; then
            echo "FATAL: 'inference_endpoint' not importable with $(command -v python3) (CLIENT_IMAGE=${{ variables.CLIENT_IMAGE }})" >&2
            exit 1
          fi
        - |
          RUN_ID="$(basename "${SFLOW_WORKFLOW_OUTPUT_DIR}")"
          RUN_ROOT="${{ artifacts.RUNTIME_DIR.path }}/${RUN_ID}"
          export MODEL_PATH="${{ variables.MODEL_PATH }}"
          export DATA_PATH="${{ artifacts.MLPERF_DATA.path }}"
          export CONCURRENCY="${{ variables.CONCURRENCY }}"
          export NUM_TRAJECTORIES="${{ variables.NUM_TRAJECTORIES }}"
          export MODE="${{ variables.MODE }}"
          case "${MODE}" in
            perf) ;;
            acc|both)
              if [ -z "${{ variables.SWEBENCH_SERVICE_ADDR }}" ]; then
                echo "FATAL: MODE=${MODE} needs the SWE-bench service, which the drop runs on the" >&2
                echo "  Slurm node with --runtime pyxis (srun + Enroot).  GKE has neither Pyxis nor a" >&2
                echo "  Docker daemon in pods.  Host one elsewhere and pass" >&2
                echo "  -s SWEBENCH_SERVICE_ADDR=<host:port>  (see ../../README.md)." >&2
                exit 2
              fi ;;
            *) echo "FATAL: MODE must be perf, acc or both (got '${MODE}')" >&2; exit 2 ;;
          esac
        # (2) Hard-fail on missing assets: a missing fs:// path is only a plan-time
        #     warning (guide F5).
        - |
          fail=0
          [ -f "${MODEL_PATH}/config.json" ] || { echo "MISSING model: ${MODEL_PATH}/config.json" >&2; fail=1; }
          [ -f "${MODEL_PATH}/tokenizer.json" ] || { echo "MISSING tokenizer: ${MODEL_PATH}/tokenizer.json (client.yaml tokenizer_name: \${MODEL_PATH})" >&2; fail=1; }
          PERF_JSONL="${DATA_PATH}/perf/mlperf_agentic_inference_dataset.jsonl"
          if [ -f "${PERF_JSONL}" ]; then
            GOT="$(sha256sum "${PERF_JSONL}" | cut -d' ' -f1)"
            if [ "${GOT}" = "1beb24c882122df96571cf11b390acbea388944038bc55c78b891475459014ae" ]; then
              echo "Using official dataset at: ${PERF_JSONL} (sha256 ${GOT})"
            else
              echo "CORRUPT perf dataset: sha256 ${GOT} != 1beb24c882122df96571cf11b390acbea388944038bc55c78b891475459014ae" >&2; fail=1
            fi
          else
            echo "MISSING perf dataset: ${PERF_JSONL}" >&2; fail=1
          fi
          if [ "${MODE}" != perf ] && [ ! -f "${DATA_PATH}/dataset_cache/swe_bench_verified_test.parquet" ]; then
            echo "MISSING SWE-bench Verified parquet: ${DATA_PATH}/dataset_cache/swe_bench_verified_test.parquet (required for MODE=${MODE})" >&2; fail=1
          fi
          if [ "${fail}" != 0 ]; then
            echo "Stage the assets on every node (kubectl apply -f ../../stage-assets.yaml). Refusing to run." >&2
            exit 1
          fi
        # (3) Slurm bind mount ${DATA_PATH}/dataset_cache -> <node-mount>/inference-endpoint/dataset_cache:ro,
        #     reproduced with a symlink (sflow can only hostPath-mount fs:// at its own path).
        - |
          if [ -d "${DATA_PATH}/dataset_cache" ]; then
            mkdir -p <node-mount>/inference-endpoint
            [ -e <node-mount>/inference-endpoint/dataset_cache ] || ln -s "${DATA_PATH}/dataset_cache" <node-mount>/inference-endpoint/dataset_cache
            ls -ld <node-mount>/inference-endpoint/dataset_cache
          fi
        # (4) Durable REPORT_DIR on the node's SSD, printed early (guide F31).
        - |
          export REPORT_DIR="${{ artifacts.REPORTS_DIR.path }}/$(basename "${SFLOW_WORKFLOW_OUTPUT_DIR}")"
          mkdir -p "${REPORT_DIR}"
          echo "DSV41_REPORT_DIR node=${SFLOW_TASK_NODE_NAME:-$(hostname)} path=${REPORT_DIR}"
        # GKE: wait until the frontend lists the served model (worker readiness
        # proves registration; this proves the frontend's file-discovery saw it).
        - |
          FE="http://$(grep -v '^[[:space:]]*$' ${{ artifacts.VLLM_URLS.path }} | head -1)"
          python3 - "${FE}" "deepseek-ai/DeepSeek-V4.1-Flash" <<'EOF_WAIT'
          import json, sys, time, urllib.request
          fe, model = sys.argv[1], sys.argv[2]
          deadline = time.monotonic() + 900
          last = ""
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen(fe + "/v1/models", timeout=10) as r:
                      ids = [m.get("id") for m in json.load(r).get("data", [])]
                  if model in ids:
                      print("DSV41_FRONTEND_READY %s serves %s" % (fe, model), flush=True)
                      sys.exit(0)
                  last = repr(ids)
              except Exception as exc:  # noqa: BLE001
                  last = repr(exc)
              time.sleep(5)
          sys.exit("FATAL: %s never listed %s; last: %s" % (fe, model, last))
          EOF_WAIT
        # SWE-bench forwarder (acc/both only): client.yaml hard-codes
        # http://127.0.0.1:18080; forward it to SWEBENCH_SERVICE_ADDR so client.yaml stays verbatim.
        - |
          if [ "${MODE}" != perf ]; then
            python3 - "${{ variables.SWEBENCH_SERVICE_ADDR }}" "18080" <<'EOF_FWD' &
          import asyncio, sys
          host, port = sys.argv[1].rsplit(":", 1)
          local_port = int(sys.argv[2])
          async def pipe(reader, writer):
              try:
                  while True:
                      data = await reader.read(65536)
                      if not data:
                          break
                      writer.write(data)
                      await writer.drain()
              finally:
                  writer.close()
          async def handle(cr, cw):
              ur, uw = await asyncio.open_connection(host, int(port))
              await asyncio.gather(pipe(cr, uw), pipe(ur, cw))
          async def main():
              server = await asyncio.start_server(handle, "127.0.0.1", local_port)
              async with server:
                  await server.serve_forever()
          asyncio.run(main())
          EOF_FWD
            for i in $(seq 1 60); do
              if python3 -c 'import sys, urllib.request; urllib.request.urlopen(sys.argv[1], timeout=5)' "http://127.0.0.1:18080/health" 2>/dev/null; then
                echo "SWE-bench service reachable via http://127.0.0.1:18080 -> ${{ variables.SWEBENCH_SERVICE_ADDR }}"; break
              fi
              [ "${i}" = 60 ] && { echo "FATAL: SWE-bench service not healthy at ${{ variables.SWEBENCH_SERVICE_ADDR }}" >&2; exit 1; }
              sleep 5
            done
          fi
        # (5) The drop's endpoint_client script item (anchored substitutions only, WITHOUT exec):
        - |
          set -euo pipefail
          ENV_EXPORTS=$(/opt/venv/bin/python3 ${{ artifacts.RUN_WITH_ENV.path }} ${{ artifacts.ENDPOINT_ENV_YAML.path }} | tee /dev/stderr)
          eval "$ENV_EXPORTS"
          VLLM_URLS_LIST=$(grep -v '^[[:space:]]*$' ${{ artifacts.VLLM_URLS.path }} | paste -sd ',')
          test -n "$VLLM_URLS_LIST"
          RESOLVED_ENDPOINT_YAML=${SFLOW_TASK_OUTPUT_DIR}/client.resolved.yaml
          /opt/venv/bin/python3 ${{ artifacts.GENERATE_ENDPOINT_YAML.path }} --input ${{ artifacts.CLIENT_CONFIG.path }} --frontend-urls "$VLLM_URLS_LIST" --output "$RESOLVED_ENDPOINT_YAML"
          /opt/venv/bin/inference-endpoint validate-yaml --config "$RESOLVED_ENDPOINT_YAML"
          # Share the frontend's remaining CPU set, separate from worker cores.
          # example for one node: CLIENT_CPUS=0,25-88,113-176,201-264,289-351.
          # taskset applies CPU affinity only; no explicit NUMA memory binding here.
          CLIENT_CPUS=$(cat "$RUN_ROOT/host_cpus.txt")
          taskset -c "$CLIENT_CPUS" /opt/venv/bin/inference-endpoint benchmark from-config \
            --config "$RESOLVED_ENDPOINT_YAML" --mode ${{ variables.MODE }} \
            2>&1 | stdbuf -o0 tr '\r' '\n'
        # (6) Mirror the small report files back for sflow's collect; never mask
        #     the benchmark exit code.
        - |
          DEST="${SFLOW_WORKFLOW_OUTPUT_DIR}/report"
          mkdir -p "${DEST}"
          ( cd "${REPORT_DIR}" \
            && find . -type f ! -name 'events.jsonl' -print0 \
               | tar cf - --null -T - ) 2>/dev/null \
            | ( cd "${DEST}" && tar xf - ) 2>/dev/null || true
          echo "mirrored report -> ${DEST}:"
          ls -la "${DEST}" || true
          echo "durable copy retained on node at ${REPORT_DIR}"
      probes:
        failure:
          log_watch:
            regex_pattern: "re:(?i)(token metric recorder failed|tokenizer drain (?:timed out|failed)|swebench service exited)"
