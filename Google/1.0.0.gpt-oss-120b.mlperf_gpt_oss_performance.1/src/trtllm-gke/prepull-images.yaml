# Pre-pull the three GPT-OSS-120B run images onto every node.
#
# Why this exists: the TRT-LLM release image is a multi-GB arm64 manifest, and
# every one of the 18 nodes needs it.  A cold pull on 18 nodes at once is
# minutes of wall clock during which the server pods sit in ContainerCreating.
# sflow's `reservation.timeout` (1800 s) and the prefill/decode `log_watch`
# readiness probes (3600 s) are both counting during that window, so a cold pull
# can fail the run before trtllm-serve has executed a single line.
#
# Running this first makes the pull a one-time cost, and -- more usefully -- it
# is a real scheduling rehearsal: if an image is the wrong architecture, a
# registry is unreachable, or a node has no disk headroom, it surfaces here as
# a clear ImagePullBackOff instead of inside an 18-node reservation.
#
# GPT-OSS needs THREE images (DSR1 needed one).  The LiveCodeBench image is
# pulled because the Slurm template starts lcb_service in every mode including
# perf; if you run with -s WITH_LCB=false you can drop that container from this
# manifest, but leaving it in costs only disk.
#
#   kubectl apply -f prepull-images.yaml
#   kubectl rollout status ds/prepull-gptoss-images --timeout=60m
#   kubectl delete -f prepull-images.yaml
#
# The pods intentionally do nothing: `imagePullPolicy: IfNotPresent` plus a
# trivial command means kubelet pulls the layers into the node's containerd
# content store and then idles.  Deleting the DaemonSet does NOT evict the
# cached images -- only kubelet GC under disk pressure does, and these nodes
# have ~11 TB of ephemeral storage.
#
# KEEP THESE IN SYNC with TRTLLM_IMAGE / CLIENT_IMAGE / LCB_IMAGE in the point
# recipes.  If you mirror into Artifact Registry, change them in both places.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: prepull-gptoss-images
  labels:
    app: prepull-gptoss-images
spec:
  selector:
    matchLabels:
      app: prepull-gptoss-images
  template:
    metadata:
      labels:
        app: prepull-gptoss-images
    spec:
      # Match the recipes' backend node_selector exactly, so we warm the same
      # machines the run will land on.
      nodeSelector:
        cloud.google.com/gke-nodepool: <nodepool>
      tolerations:
        - key: "kubernetes.io/arch"
          operator: "Equal"
          value: "arm64"
          effect: "NoSchedule"
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      # Init containers run to completion in order, so a node finishes the big
      # TRT-LLM pull before starting the client pull.  Sequencing them keeps a
      # single node from saturating its own NIC with two multi-GB pulls at once.
      initContainers:
        # TRTLLM_IMAGE.  The drop certifies arm64 manifest
        # sha256:e71eb8056ac1c717e6b727f9d66ebba9442e95f7ebc3514007b541046e84b088;
        # pull by tag here and verify the digest kubelet resolved with
        #   kubectl get pod <pod> -o jsonpath='{.status.initContainerStatuses[0].imageID}'
        - name: pull-trtllm
          image: nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc14
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "echo PULLED trtllm on $(uname -m)"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
        # LCB_IMAGE.
        - name: pull-lcb
          image: ghcr.io/mlcommons/endpoints:9d749906-livecodebench
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "echo PULLED livecodebench on $(uname -m)"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
      containers:
        # CLIENT_IMAGE.
        - name: pull-client
          image: ghcr.io/mlcommons/endpoints:e9f427c
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "echo PREPULL COMPLETE on $(uname -m); sleep infinity"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
      terminationGracePeriodSeconds: 0
