    model-00095-of-000096.safetensors 92289328 sha256 01d41139abb8cf3b5288a97318cc4ab92676671b4eb141031cd80d7c3ced6122
    model-00096-of-000096.safetensors 802448352 sha256 9d10c74fc10161bef9463a8541a634a97f521f43c99368ea7243ce0c79cdbf7c
    model.safetensors.index.json 117595992 sha256 d8e106f404cdd92b53666b07c8225ec69ea86d55ead18dc3b9f5e2b7930a578d
    modeling_kimi_k3.py 53444 gitsha1 be85612710534c2e41065b67933a9639e7817d7f
