  # RadixArk/Kimi-K3-DSpark @ 3c5bac301d9cf392706189d82ed947feca6c2f0f (HF tree API).
  kimi-k3-dspark.manifest: |
    .complete 19 gitsha1 0b4ac97505a774c1cb101147385b168be891c3bb
    .gitattributes 1519 gitsha1 a6344aac8c09253b3b630fb776ae94478aa0275b
    README.md 3899 gitsha1 9227dbfe7056e55b09da674294920c01b854ef9d
    config.json 1352 gitsha1 6dbf81a39f7760c2c42a32cc972bc6b431ccce9e
    dflash.py 19080 gitsha1 28992c82a9855e4a539354984e384c9c6039d715
    dspark.py 6346 gitsha1 3d7bda332deb48ed7772e7a4fc7d7fc758bf1f6a
    model.safetensors 4498585858 sha256 ecd746459b4a603ce0d2c64f73935efead29bd651b14439b99e57ee8b41b77ca
  verify_hashes.py: |
    """Hash every file of a staged checkpoint against its manifest.

    usage: verify_hashes.py [--delete-bad] <dir> <manifest> <threads>
    manifest lines: "<path> <size> sha256|gitsha1 <hex>" (gitsha1 = git blob sha1).
    Prints one line per bad file and a summary; exit 0 only if every file matches.
    --delete-bad unlinks files whose content mismatches at the right size, so the
    next rsync re-fetches them (rsync skips a same-size, same-mtime file).
    """
    import hashlib
    import os
    import re
    import stat
    import sys
    from concurrent.futures import ThreadPoolExecutor

    LINE = re.compile(
        r"^([A-Za-z0-9._/-]+) (0|[1-9][0-9]{0,14}) "
        r"(sha256 [0-9a-f]{64}|gitsha1 [0-9a-f]{40})$")
    CHUNK = 8 << 20


    def load(path):
        rows, seen = [], set()
        with open(path, encoding="ascii") as fh:
            for n, line in enumerate(fh.read().split("\n"), 1):
                if line == "" and n > 1:
                    continue
                m = LINE.match(line)
                if not m:
                    raise ValueError(f"line {n} is malformed")
                rel = m.group(1)
                if any(p in ("", ".", "..") for p in rel.split("/")):
                    raise ValueError(f"line {n}: unsafe path")
                if rel in seen:
                    raise ValueError(f"line {n}: duplicate path")
                seen.add(rel)
                kind, want = m.group(3).split(" ")
                rows.append((rel, int(m.group(2)), kind, want))
        if not rows:
            raise ValueError("no entries")
        return rows


    def check(root, row):
        rel, size, kind, want = row
        path = os.path.join(root, rel)
        if not os.path.realpath(path).startswith(root + os.sep):
            return rel, "CORRUPT", "resolves outside the model directory"
        try:
            fd = os.open(path, os.O_RDONLY | getattr(os, "O_NOFOLLOW", 0))
        except FileNotFoundError:
            return rel, "MISSING", "absent"
        except OSError as e:
            return rel, "CORRUPT", f"cannot open ({e.strerror})"
        with os.fdopen(fd, "rb") as fh:
            st = os.fstat(fh.fileno())
            if not stat.S_ISREG(st.st_mode):
                return rel, "CORRUPT", "not a regular file"
            if st.st_size != size:
                return rel, "CORRUPT", f"{st.st_size} B, expected {size} B"
            h = hashlib.sha256() if kind == "sha256" else hashlib.sha1(b"blob %d\0" % size)
            try:
                for chunk in iter(lambda: fh.read(CHUNK), b""):
                    h.update(chunk)
            except OSError as e:
                return rel, "CORRUPT", f"read error ({e.strerror})"
        if h.hexdigest() != want:
            return rel, "MISMATCH", f"{kind} mismatch"
        return rel, None, None


    def main(argv):
        args = argv[1:]
        delete = bool(args) and args[0] == "--delete-bad"
        if delete:
            args = args[1:]
        if len(args) != 3 or not re.fullmatch(r"[1-9][0-9]{0,2}", args[2]) or int(args[2]) > 256:
            print("usage: verify_hashes.py [--delete-bad] <dir> <manifest> <threads 1-256>")
            return 2
        root = os.path.realpath(args[0])
        if not os.path.isdir(root):
            print(f"MISSING: {args[0]} is not a directory")
            return 2
        try:
            rows = load(args[1])
        except (OSError, ValueError, UnicodeDecodeError) as e:
            print(f"CORRUPT: manifest {args[1]}: {e}")
            return 2
        with ThreadPoolExecutor(int(args[2])) as ex:
            results = list(ex.map(lambda r: check(root, r), rows))
        bad = [r for r in results if r[1]]
        for rel, tag, why in bad:
            if tag == "MISMATCH":
                tag = "CORRUPT"
                if delete:
                    try:
                        os.unlink(os.path.join(root, rel))
                        why += "; deleted, the restage re-fetches it"
                    except OSError as e:
                        why += f"; delete failed ({e.strerror})"
            print(f"{tag}: {rel}: {why}")
        print(f"hashed {len(rows)} files: {len(rows) - len(bad)} match, {len(bad)} bad")
        return 1 if bad else 0


    if __name__ == "__main__":
        sys.exit(main(sys.argv))
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: stage-kimi-k3-v3-assets
  namespace: default
  labels:
    app: stage-kimi-k3-v3-assets
spec:
  selector:
    matchLabels:
      app: stage-kimi-k3-v3-assets
  # Replace every pod at once on restart: a node-by-node rollout of a 1.6 TB
  # copy would take a day.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: "100%"
  template:
    metadata:
      labels:
        app: stage-kimi-k3-v3-assets
    spec:
      # Every node in the pool: sflow picks the nodes to reserve at run time.
      nodeSelector:
        cloud.google.com/gke-nodepool: <nodepool>
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      - {key: kubernetes.io/arch, operator: Equal, value: arm64, effect: NoSchedule}
      # GCS access is the node service account (metadata server); no API token needed.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      containers:
      - name: stage
        # Multi-arch (arm64). Has bash, python3, sha256sum and gcloud; no curl.
        # Runs as root: the hostPath directories are root-owned.
        image: <registry>/cloudsdktool/google-cloud-cli:stable
        envFrom:
        - configMapRef:
            name: stage-kimi-k3-v3-assets-src
        env:
        - name: NODE_NAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        securityContext:
          allowPrivilegeEscalation: false
        readinessProbe:
          exec:
            command: ["test", "-f", "/tmp/sflow-stage-ready"]
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 1
        command: ["bash", "-c"]
        args:
        - |
          set -uo pipefail
          MODELS=/model-cache
          DATA=/mlperf-data
          MAN=/stage-manifest
          READY=/tmp/sflow-stage-ready
          rm -f "${READY}"
          FAILED=0
          fail() { echo "MISSING: $*"; FAILED=1; }
          idle() { trap 'exit 0' TERM; sleep infinity & wait; exit 0; }
          echo "stage-kimi-k3-v3-assets on ${NODE_NAME:-unknown-node}"
          : "${SRC_MODEL=}" "${SRC_MODEL_RECORD=}" "${RECORD_WAIT_MIN=}" "${MODEL_REPO=}"
          : "${MODEL_REVISION=}" "${EXPECTED_MODEL_FILES=}" "${EXPECTED_MODEL_BYTES=}"
          : "${SRC_DRAFT=}" "${DRAFT_REVISION=}" "${EXPECTED_DRAFT_FILES=}" "${EXPECTED_DRAFT_BYTES=}"
          : "${SRC_DATASET=}" "${DATASET_SHA256=}" "${VERIFY_SHA256=}" "${HASH_THREADS=}"
          : "${MIN_FREE_PCT_AFTER=}"

          # --- 1. configuration and manifests (nothing on disk is touched yet) ---
          CONFIG_OK=1
          bad() { echo "CONFIG: $*"; CONFIG_OK=0; }
          GS_RE='^<bucket>[a-z0-9][-a-z0-9_.]{1,61}[a-z0-9](/[A-Za-z0-9._-]+)+$'
          INT_RE='^(0|[1-9][0-9]{0,14})$'
          LINE_RE='^([A-Za-z0-9._/-]+) (0|[1-9][0-9]{0,14}) (sha256 [0-9a-f]{64}|gitsha1 [0-9a-f]{40})$'
          DOT_RE='/\.\.?(/|$)'
          REPO_RE='^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$'
          gs_ok() { [[ "$1" =~ ${GS_RE} ]] && ! [[ "$1" =~ ${DOT_RE} ]]; }
          for v in RECORD_WAIT_MIN EXPECTED_MODEL_FILES EXPECTED_MODEL_BYTES \
                   EXPECTED_DRAFT_FILES EXPECTED_DRAFT_BYTES HASH_THREADS MIN_FREE_PCT_AFTER; do
            [[ "${!v}" =~ ${INT_RE} ]] || bad "${v}='${!v}' is not a non-negative integer"
          done
          if [ "${CONFIG_OK}" = 1 ]; then
            [ "${RECORD_WAIT_MIN}" -le 1440 ] || bad "RECORD_WAIT_MIN must be <= 1440"
            [ "${HASH_THREADS}" -ge 1 ] && [ "${HASH_THREADS}" -le 256 ] || bad "HASH_THREADS must be 1..256"
            [ "${MIN_FREE_PCT_AFTER}" -le 90 ] || bad "MIN_FREE_PCT_AFTER must be <= 90"
            [ "${EXPECTED_MODEL_FILES}" -ge 1 ] && [ "${EXPECTED_DRAFT_FILES}" -ge 1 ] \
              || bad "EXPECTED_*_FILES must be >= 1"
          fi
          [[ "${MODEL_REPO}" =~ ${REPO_RE} ]] \
            || bad "MODEL_REPO='${MODEL_REPO}' is not <org>/<name>"
          [[ "${MODEL_REVISION}" =~ ^[0-9a-f]{40}$ ]] || bad "MODEL_REVISION must be a 40-hex commit sha"
          [[ "${DRAFT_REVISION}" =~ ^[0-9a-f]{40}$ ]] || bad "DRAFT_REVISION must be a 40-hex commit sha"
          [[ "${DATASET_SHA256}" =~ ^[0-9a-f]{64}$ ]] || bad "DATASET_SHA256 must be 64 hex chars"
          case "${VERIFY_SHA256}" in 0|1|force) ;; *) bad "VERIFY_SHA256 must be 0, 1 or force";; esac
          if [ -n "${SRC_MODEL}" ]; then
            { gs_ok "${SRC_MODEL}" && [[ "${SRC_MODEL}" == */Kimi-K3-NVFP4 ]]; } \
              || bad "SRC_MODEL must be \"\" or <bucket><bucket>/.../Kimi-K3-NVFP4"
            gs_ok "${SRC_MODEL_RECORD}" || bad "SRC_MODEL_RECORD is not a <bucket><bucket>/<object> URI"
            b1=${SRC_MODEL#<bucket>; b2=${SRC_MODEL_RECORD#<bucket>
            [ "${b1%%/*}" = "${b2%%/*}" ] || bad "SRC_MODEL_RECORD must be in the bucket of SRC_MODEL"
            [[ "${SRC_MODEL_RECORD}" == *"${MODEL_REVISION:0:8}"* ]] \
              || bad "SRC_MODEL_RECORD must name revision ${MODEL_REVISION:0:8}"
          fi
          if [ -n "${SRC_DRAFT}" ]; then
            { gs_ok "${SRC_DRAFT}" && [[ "${SRC_DRAFT}" == */Kimi-K3-DSpark ]]; } \
              || bad "SRC_DRAFT must be \"\" or <bucket><bucket>/.../Kimi-K3-DSpark"
          fi
          if [ -n "${SRC_DATASET}" ]; then
            gs_ok "${SRC_DATASET}" || bad "SRC_DATASET must be \"\" or a <bucket> URI (no curl here)"
          fi

          check_manifest() {  # <file> <files> <bytes>
            local f="$1" nf="$2" nb="$3" line path n=0 sum=0 rc=0
            local -A seen=()
            if [ ! -f "${f}" ] || [ ! -r "${f}" ]; then bad "manifest ${f} is missing"; return 1; fi
            while IFS= read -r line || [ -n "${line}" ]; do
              n=$((n + 1))
              if ! [[ "${line}" =~ ${LINE_RE} ]]; then bad "${f}:${n}: malformed line"; rc=1; continue; fi
              path=${BASH_REMATCH[1]}
              if [[ "/${path}/" == *//* || "/${path}/" == */./* || "/${path}/" == */../* \
                    || "/${path}" == */.sflow-* || "/${path}/" == */__pycache__/* || "${path}" == .cache/* ]]; then
                bad "${f}:${n}: unsafe path '${path}'"; rc=1; continue
              fi
              if [ -n "${seen[${path}]:-}" ]; then bad "${f}:${n}: duplicate '${path}'"; rc=1; continue; fi
              seen[${path}]=1
              sum=$((sum + BASH_REMATCH[2]))
            done < "${f}"
            [ "${#seen[@]}" = "${nf}" ] || { bad "${f}: ${#seen[@]} entries, expected ${nf}"; rc=1; }
            [ "${sum}" = "${nb}" ] || { bad "${f}: ${sum} B, expected ${nb} B"; rc=1; }
            return "${rc}"
          }
          if [ "${CONFIG_OK}" = 1 ]; then
            check_manifest "${MAN}/kimi-k3-nvfp4.manifest" "${EXPECTED_MODEL_FILES}" "${EXPECTED_MODEL_BYTES}"
            check_manifest "${MAN}/kimi-k3-dspark.manifest" "${EXPECTED_DRAFT_FILES}" "${EXPECTED_DRAFT_BYTES}"
          fi
          [ -f "${MAN}/verify_hashes.py" ] || bad "${MAN}/verify_hashes.py is missing"
          if [ "${CONFIG_OK}" != 1 ]; then
            echo "NOT READY: invalid configuration (above); nothing was touched"
            idle
          fi
          TMPD=$(mktemp -d) || { echo "NOT READY: mktemp failed"; idle; }

          # --- helpers --------------------------------------------------------
          # Names of every non-directory entry, minus HF/.pyc/marker noise.
          tree_files() {  # <dir> <find -printf format>
            find "$1" -mindepth 1 \( -path "$1/.cache" -o -name __pycache__ \) -prune \
              -o ! -type d ! -name '.sflow-*' -printf "$2" 2>/dev/null
          }
          dir_matches() {  # <dir> <manifest> <files> <bytes>; details on stdout
            local dir="$1" man="$2" nf="$3" nb="$4" path size kind hash have n=0 total=0 nbad=0 entries
            if [ -L "${dir}" ] || [ ! -d "${dir}" ]; then echo "  - ${dir} does not exist"; return 1; fi
            while read -r path size kind hash || [ -n "${path:-}" ]; do
              if [ -L "${dir}/${path}" ] || [ ! -f "${dir}/${path}" ]; then
                nbad=$((nbad + 1)); [ "${nbad}" -le 5 ] && echo "  - missing: ${path}"; continue
              fi
              have=$(stat -c %s -- "${dir}/${path}" 2>/dev/null) || have=-1
              if [ "${have}" != "${size}" ]; then
                nbad=$((nbad + 1)); [ "${nbad}" -le 5 ] && echo "  - size: ${path} is ${have} B, expected ${size} B"; continue
              fi
              n=$((n + 1)); total=$((total + have))
            done < "${man}"
            [ "${nbad}" -gt 5 ] && echo "  - ... and $((nbad - 5)) more"
            entries=$(tree_files "${dir}" x | wc -c)
            if [ "${entries}" != "${nf}" ]; then
              echo "  - ${entries} files on disk, expected ${nf}"
              comm -13 <(cut -d' ' -f1 "${man}" | LC_ALL=C sort) <(tree_files "${dir}" '%P\n' | LC_ALL=C sort) \
                | head -n 5 | sed 's/^/  - extra: /'
              return 1
            fi
            [ "${nbad}" = 0 ] && [ "${n}" = "${nf}" ] && [ "${total}" = "${nb}" ]
          }
          src_matches() {  # <gs-prefix> <manifest>; the bucket must hold exactly the manifest
            local src="$1" man="$2"
            if ! gcloud storage du "${src}" > "${TMPD}/du.out" 2> "${TMPD}/du.err"; then
              echo "  - gcloud storage du ${src} failed: $(tail -n 1 "${TMPD}/du.err")"; return 1
            fi
            awk -v p="${src}/" 'index($2, p) == 1 && $2 !~ /\/$/ {
                r = substr($2, length(p) + 1); if (r !~ /^\.cache\//) print r, $1 }' \
              "${TMPD}/du.out" | LC_ALL=C sort > "${TMPD}/src.lst"
            cut -d' ' -f1,2 "${man}" | LC_ALL=C sort > "${TMPD}/man.lst"
            if ! cmp -s "${TMPD}/src.lst" "${TMPD}/man.lst"; then
              diff "${TMPD}/man.lst" "${TMPD}/src.lst" | grep '^[<>]' | head -n 5 \
                | sed -e 's/^</  - manifest only:/' -e 's/^>/  - bucket only:/'
              return 1
            fi
          }
          check_record() {  # stage_to_gcs.sh's upload verification record
            local rec="" want deadline=$(( $(date +%s) + RECORD_WAIT_MIN * 60 ))
            until rec=$(gcloud storage cat "${SRC_MODEL_RECORD}" 2>/dev/null | head -c 65536); do
              if [ "$(date +%s)" -ge "${deadline}" ]; then
                echo "  - ${SRC_MODEL_RECORD} not readable: upload not finished (the record is written last)?"
                return 1
              fi
              echo "waiting for ${SRC_MODEL_RECORD} ..."
              sleep 60
            done
            for want in "repo=${MODEL_REPO}" "revision=${MODEL_REVISION}" "files=${EXPECTED_MODEL_FILES}" \
                        "bytes=${EXPECTED_MODEL_BYTES}" "VERIFIED ${EXPECTED_MODEL_FILES}/${EXPECTED_MODEL_FILES} files, extra=0"; do
              grep -qxF -- "${want}" <<< "${rec}" || { echo "  - record lacks the line '${want}'"; return 1; }
            done
            if grep -q '^VERIFY_' <<< "${rec}"; then echo "  - record lists VERIFY_ failures"; return 1; fi
            echo "VERIFIED: upload record ${SRC_MODEL_RECORD}"
          }
          check_space() {  # <dir> <bytes>
            local dir="$1" want="$2" have=0 size avail need
            [ -d "${dir}" ] && have=$(du -sb --exclude=.cache "${dir}" 2>/dev/null | cut -f1)
            [[ "${have:-}" =~ ^[0-9]+$ ]] || have=0
            need=$(( want > have ? want - have : 0 ))
            read -r size avail < <(df -B1 --output=size,avail "${MODELS}" 2>/dev/null | tail -n 1)
            if ! [[ "${size:-}" =~ ^[0-9]+$ && "${avail:-}" =~ ^[0-9]+$ ]]; then
              echo "  - cannot read free space of ${MODELS}"; return 1
            fi
            if [ $(( avail - need )) -lt $(( size / 100 * MIN_FREE_PCT_AFTER )) ]; then
              echo "  - needs ${need} B; ${avail} of ${size} B free would leave < ${MIN_FREE_PCT_AFTER}% free"
              return 1
            fi
            echo "space: needs ${need} B, ${avail} of ${size} B free"
          }
          hashes_ok() {  # <label> <dir> <manifest> <rev> <may-delete 0|1>
            local label="$1" dir="$2" man="$3" rev="$4" del=()
            [ "${VERIFY_SHA256}" = 0 ] && return 0
            if [ "${VERIFY_SHA256}" = 1 ] && [ "$(cat "${dir}/.sflow-sha256-verified" 2>/dev/null)" = "${rev}" ]; then
              echo "VERIFIED (cached): ${label} sha256/sha1 of every file"
              return 0
            fi
            rm -f "${dir}/.sflow-sha256-verified"
            [ "$5" = 1 ] && del=(--delete-bad)
            echo "hashing ${label} (${HASH_THREADS} threads) ..."
            if python3 -B "${MAN}/verify_hashes.py" ${del[@]+"${del[@]}"} "${dir}" "${man}" "${HASH_THREADS}"; then
              printf '%s\n' "${rev}" > "${dir}/.sflow-sha256-verified"
              echo "VERIFIED: ${label} sha256/sha1 of every file"
              return 0
            fi
            return 1
          }

          # --- 2-7. a checkpoint tree ------------------------------------------
          stage_tree() {  # <label> <dir> <manifest> <files> <bytes> <src> <rev> <need-record> <accept-empty-marker>
            local label="$1" dir="$2" man="$3" nf="$4" nb="$5" src="$6" rev="$7" need_record="$8" legacy="$9"
            local marker may_delete=0
            [ -n "${src}" ] && may_delete=1
            if [ -f "${dir}/.sflow-staged" ]; then
              marker=$(head -c 128 "${dir}/.sflow-staged" 2>/dev/null)
              if [ "${marker}" = "${rev}" ] || { [ "${legacy}" = 1 ] && [ -z "${marker}" ]; }; then
                if dir_matches "${dir}" "${man}" "${nf}" "${nb}"; then
                  if hashes_ok "${label}" "${dir}" "${man}" "${rev}" "${may_delete}"; then
                    if [ "${marker}" != "${rev}" ]; then
                      if ! { printf '%s\n' "${rev}" > "${dir}/.sflow-staged.tmp" && mv -f "${dir}/.sflow-staged.tmp" "${dir}/.sflow-staged"; }; then
                        fail "${label}: cannot write ${dir}/.sflow-staged"; return 1
                      fi
                    fi
                    echo "STAGED (already complete): ${label} -> ${dir} (${nf} files, ${nb} B)"
                    return 0
                  fi
                  echo "WARN: ${label} failed hash verification (above); restaging"
                else
                  echo "WARN: ${label} is marked staged but differs from the manifest (above); restaging"
                fi
              else
                echo "WARN: ${dir}/.sflow-staged names '${marker//[^A-Za-z0-9._-]/?}', not ${rev}; restaging"
              fi
            fi
            rm -f "${dir}/.sflow-staged" "${dir}/.sflow-staged.tmp" "${dir}/.sflow-sha256-verified"
            if [ -z "${src}" ]; then
              fail "${label}: ${dir} is not staged and its SRC_* is \"\" (verify-only)"; return 1
            fi
            if [ "${need_record}" = 1 ] && ! check_record; then
              fail "${label}: no valid upload record (above); nothing copied"; return 1
            fi
            if ! src_matches "${src}" "${man}"; then
              fail "${label}: ${src} does not match the manifest (above); nothing copied"; return 1
            fi
            if ! check_space "${dir}" "${nb}"; then
              fail "${label}: not enough disk (above); nothing copied"; return 1
            fi
            mkdir -p "${dir}" || { fail "${label}: cannot create ${dir}"; return 1; }
            echo "Copying ${label} from ${src} ... (resumable)"
            if ! gcloud storage rsync --recursive --delete-unmatched-destination-objects \
                 --exclude='^\.cache/|^\.sflow-|^(.*/)?__pycache__/' "${src}" "${dir}"; then
              fail "${label}: copy from ${src} failed (rollout restart resumes it)"; return 1
            fi
            if ! dir_matches "${dir}" "${man}" "${nf}" "${nb}"; then
              fail "${label}: copied tree differs from the manifest (above); NOT marking complete"; return 1
            fi
            if ! hashes_ok "${label}" "${dir}" "${man}" "${rev}" 1; then
              fail "${label}: hash verification failed after copy (bad files deleted; rollout restart re-fetches)"
              return 1
            fi
            if ! { printf '%s\n' "${rev}" > "${dir}/.sflow-staged.tmp" && mv -f "${dir}/.sflow-staged.tmp" "${dir}/.sflow-staged"; }; then
              fail "${label}: cannot write ${dir}/.sflow-staged"; return 1
            fi
            echo "STAGED: ${label} -> ${dir} (${nf} files, ${nb} B)"
          }

          stage_dataset() {
            local dest="${DATA}/mlperf_agentic_inference_dataset.jsonl" got
            if [ -f "${dest}" ] && [ ! -L "${dest}" ]; then
              got=$(sha256sum "${dest}" | cut -d' ' -f1)
              if [ "${got}" = "${DATASET_SHA256}" ]; then
                echo "STAGED (already present): agentic dataset -> ${dest}"
                echo "VERIFIED: dataset sha256 matches the MLPerf runbook"
                return 0
              fi
              echo "CORRUPT: dataset sha256 ${got} != ${DATASET_SHA256}"
            fi
            if [ -z "${SRC_DATASET}" ]; then
              fail "agentic dataset: ${dest} is absent or wrong and SRC_DATASET is \"\" (verify-only)"; return 1
            fi
            rm -f "${dest}.tmp"
            if ! gcloud storage cp "${SRC_DATASET}" "${dest}.tmp"; then
              rm -f "${dest}.tmp"; fail "agentic dataset: copy from ${SRC_DATASET} failed"; return 1
            fi
            got=$(sha256sum "${dest}.tmp" | cut -d' ' -f1)
            if [ "${got}" != "${DATASET_SHA256}" ]; then
              rm -f "${dest}.tmp"
              echo "CORRUPT: downloaded dataset sha256 ${got} != ${DATASET_SHA256}; not installed"
              FAILED=1; return 1
            fi
            mv -f "${dest}.tmp" "${dest}" || { fail "agentic dataset: cannot install ${dest}"; return 1; }
            echo "STAGED: agentic dataset -> ${dest}"
            echo "VERIFIED: dataset sha256 matches the MLPerf runbook"
          }

          mkdir -p "${MODELS}" "${MODELS}/kimi-control-plane" "${DATA}"
          stage_tree "Kimi-K3-NVFP4@${MODEL_REVISION:0:8}" "${MODELS}/Kimi-K3-NVFP4" \
            "${MAN}/kimi-k3-nvfp4.manifest" "${EXPECTED_MODEL_FILES}" "${EXPECTED_MODEL_BYTES}" \
            "${SRC_MODEL}" "${MODEL_REVISION}" 1 0
          # The draft dir is shared with v1.0.1, whose marker is empty (touch).
          stage_tree "Kimi-K3-DSpark@${DRAFT_REVISION:0:8}" "${MODELS}/Kimi-K3-DSpark" \
            "${MAN}/kimi-k3-dspark.manifest" "${EXPECTED_DRAFT_FILES}" "${EXPECTED_DRAFT_BYTES}" \
            "${SRC_DRAFT}" "${DRAFT_REVISION}" 0 1
          stage_dataset
          rm -rf "${TMPD}"

          if [ "${FAILED}" = 0 ]; then
            touch "${READY}"
            echo "STAGED: node ready"
          else
            echo "NOT READY: fix the above, then kubectl rollout restart ds/stage-kimi-k3-v3-assets"
          fi
          idle
        volumeMounts:
        - {name: model-cache, mountPath: /model-cache}
        - {name: mlperf-data, mountPath: /mlperf-data}
        - {name: stage-manifest, mountPath: /stage-manifest, readOnly: true}
        resources:
          requests: {cpu: "500m", memory: 1Gi}
      volumes:
      - name: model-cache
        hostPath:
          path: <node-local-ssd>/model-cache
          type: DirectoryOrCreate
      - name: mlperf-data
        hostPath:
          path: <node-local-ssd>/mlperf-data
          type: DirectoryOrCreate
      - name: stage-manifest
        configMap:
          name: stage-kimi-k3-v3-assets-manifest
          defaultMode: 0444
