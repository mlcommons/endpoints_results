# Stage the Kimi K3 v1.0.3 assets onto every node of the A4X-max pool.
#
# v1.0.3 (same checkpoints and dataset as v1.0.2): the server checkpoint is nvidia/Kimi-K3-NVFP4@b2428a0b
# (NVIDIA/src/kimi-k3/README.md "Model and data"), 116 files, 1,610,039,528,856 B.
# It is staged NEXT TO the v1.0.1 checkpoint, under its own DaemonSet/ConfigMap
# names, so v1.0.1 recipes keep working. The DSpark draft and the dataset are
# unchanged and keep their v1.0.1 node paths (v1.0.1-staged nodes do not re-copy):
#
#   MODEL_PATH      <node-local-ssd>/model-cache/Kimi-K3-NVFP4
#   SGL_DRAFT_PATH  <node-local-ssd>/model-cache/Kimi-K3-DSpark
#   DATASET_PATH    <node-local-ssd>/mlperf-data/mlperf_agentic_inference_dataset.jsonl
#
# The drop calls the dataset agentic_combined_v6.jsonl; v1.0.3 dataset/README.md
# gives the same sha256 (1beb24c8...), so the v1.0.1 file is reused as is.
#
# Gates, in order. Each fails closed: no .sflow-staged marker, pod stays NotReady.
#   1. ConfigMap values and the embedded manifests are validated before any disk access.
#   2. The model copy starts only if the record stage_to_gcs.sh uploads LAST exists
#      and states repo, revision, files=116, exact bytes, "VERIFIED 116/116 files,
#      extra=0" and no VERIFY_ lines -- a bucket that is still filling is never mirrored.
#   3. Source preflight: `gcloud storage du` of the prefix must list exactly the
#      manifest's names and sizes (.cache/ ignored). This also guards the
#      --delete-unmatched-destination-objects rsync against a wrong prefix.
#   4. Free space: the copy must leave >= MIN_FREE_PCT_AFTER % of the disk free. The
#      disk is also the kubelet's ephemeral storage and image store; above 85% used
#      the kubelet garbage-collects unused images, prepulled server image first.
#   5. After rsync the tree must equal the manifest: every file regular and of exact
#      size, no extra files (.cache/, __pycache__/, .sflow-* ignored), exact count/bytes.
#   6. VERIFY_SHA256=1: sha256 (LFS files) / git blob sha1 (small files) of every file,
#      once per revision (cached in .sflow-sha256-verified). A same-size mismatch is
#      deleted so the restage re-fetches it (rsync alone would skip it).
#   7. Only then .sflow-staged := revision, written atomically. A recipe can assert
#      [ "$(cat ${MODEL_PATH}/.sflow-staged)" = b2428a0b83a8b712ff2e1a8448a103d4175341f1 ].
#
#   kubectl apply -f stage-kimi-k3-assets.yaml
#   kubectl rollout status ds/stage-kimi-k3-v3-assets --timeout=180m
#   kubectl logs -l app=stage-kimi-k3-v3-assets --tail=8 --prefix | sort
#   kubectl delete -f stage-kimi-k3-assets.yaml      # staged files persist
#
# Unlike v1.0.1, a pod is Ready only after `STAGED: node ready` (readiness probe on
# /tmp/sflow-stage-ready): `rollout status` returns when every node is verified, and
# a node printing `NOT READY` holds it until the timeout -- read that node's log.
# Re-run after fixing a source or once the upload record lands (rsync resumes):
#   kubectl rollout restart ds/stage-kimi-k3-v3-assets
# Verify-only pass: set SRC_MODEL, SRC_DRAFT and SRC_DATASET to "".
# Do not run it together with v1.0.1's stage-kimi-k3-assets (both write
# Kimi-K3-DSpark), nor while a benchmark runs on the pool (copy and hashing load
# each node's disk, NIC and CPU).
apiVersion: v1
kind: ConfigMap
metadata:
  name: stage-kimi-k3-v3-assets-src
  namespace: default
data:
  # nvidia/Kimi-K3-NVFP4 @ MODEL_REVISION, uploaded and hash-verified by
  # v1.0.3/kimi-k3/stage_to_gcs.sh. Must end in /Kimi-K3-NVFP4.
  SRC_MODEL: "<bucket>/models/Kimi-K3-NVFP4"
  # The record stage_to_gcs.sh writes after upload + bucket count/bytes check.
  # Same bucket as SRC_MODEL; must name the revision's first 8 hex chars.
  SRC_MODEL_RECORD: "<bucket>/staging-logs/kimi-k3-nvfp4-b2428a0b.verified.txt"
  # Minutes to poll for the record before failing (0 = fail at once). Set e.g.
  # "240" to apply this while the upload is still running.
  RECORD_WAIT_MIN: "0"
  MODEL_REPO: "nvidia/Kimi-K3-NVFP4"
  MODEL_REVISION: "b2428a0b83a8b712ff2e1a8448a103d4175341f1"
  EXPECTED_MODEL_FILES: "116"
  EXPECTED_MODEL_BYTES: "1610039528856"
  # RadixArk/Kimi-K3-DSpark @ DRAFT_REVISION, unchanged since v1.0.1. The bucket
  # objects equal the HF tree (7 files, 4,498,618,073 B) plus 1,848 B of .cache/.
  SRC_DRAFT: "<bucket>/models/Kimi-K3-DSpark"
  DRAFT_REVISION: "3c5bac301d9cf392706189d82ed947feca6c2f0f"
  EXPECTED_DRAFT_FILES: "7"
  EXPECTED_DRAFT_BYTES: "4498618073"
  # <bucket> only: this image has no curl/wget and its python3 has no CA bundle.
  SRC_DATASET: "<bucket>/mlperf-data/mlperf_agentic_inference_dataset.jsonl"
  DATASET_SHA256: "1beb24c882122df96571cf11b390acbea388944038bc55c78b891475459014ae"
  # "1": hash every file once per revision; "force": re-hash even if cached;
  # "0": names, sizes, count and total bytes only.
  VERIFY_SHA256: "1"
  HASH_THREADS: "16"
  MIN_FREE_PCT_AFTER: "15"
---
