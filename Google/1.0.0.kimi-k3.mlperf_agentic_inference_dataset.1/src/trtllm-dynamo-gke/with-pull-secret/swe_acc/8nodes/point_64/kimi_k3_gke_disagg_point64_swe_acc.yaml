operators:
# GKE EDIT (D1): srun operators -> Kubernetes. slots_per_worker = the pod's GPUs;
# sflow's default cpu_bind=core maps ranks --map-by ppr:<slots>:node, i.e. packed
# per pod, which TRT-LLM needs (device = global rank % GPUs per pod).
- name: server_ctx
  type: k8s_mpi
  image: ${{ variables.SERVER_IMAGE }}
  image_pull_policy: IfNotPresent
  # GKE ADD (with-pull-secret variant): registry credentials for the private
  # server image, for kubelets that re-check them even for cached images.
  image_pull_secrets:
  - nv-gitlab-pull
  shm_size: 64Gi
  run_as_root: true
  security_context:
    privileged: true
  mpi:
    route: auto
    # = the drop's srun ntasks_per_node for CTX_GPUS, verbatim
    slots_per_worker: ${{ (variables.CTX_GPUS | int) if (variables.CTX_GPUS | int) < 4 else 4 }}
    run_launcher_as_worker: true
    launcher_creation_policy: WaitForWorkersReady
    ssh_port: 2222
    ensure_sshd: true
- name: server_gen
  type: k8s_mpi
  image: ${{ variables.SERVER_IMAGE }}
  image_pull_policy: IfNotPresent
  # GKE ADD (with-pull-secret variant): registry credentials for the private
  # server image, for kubelets that re-check them even for cached images.
  image_pull_secrets:
  - nv-gitlab-pull
  shm_size: 64Gi
  run_as_root: true
  security_context:
    privileged: true
  mpi:
    route: auto
    # = the drop's srun ntasks_per_node for GEN_GPUS, verbatim
    slots_per_worker: ${{ (variables.GEN_GPUS | int) if (variables.GEN_GPUS | int) < 4 else 4 }}
    run_launcher_as_worker: true
    launcher_creation_policy: WaitForWorkersReady
    ssh_port: 2222
    ensure_sshd: true
# CPU-only server pod (preflight, control_plane, frontend): no GPU, not privileged.
- name: server_cpu
  type: k8s
  image: ${{ variables.SERVER_IMAGE }}
  image_pull_policy: IfNotPresent
  # GKE ADD (with-pull-secret variant): registry credentials for the private
  # server image, for kubelets that re-check them even for cached images.
  image_pull_secrets:
  - nv-gitlab-pull
  shm_size: 16Gi
  run_as_root: true
- name: client
  type: k8s
  image: ${{ variables.CLIENT_IMAGE }}
  image_pull_policy: IfNotPresent
  shm_size: 16Gi
  run_as_root: true

backends:
# GKE EDIT (D1): Slurm backend -> Kubernetes. Named `cluster` like the drop so the
# setup.yaml workflow variables (backends.cluster.nodes[...]) stay verbatim.
- name: cluster
  type: kubernetes
  default: true
  namespace: ${{ variables.K8S_NAMESPACE }}
  nodes: ${{ variables.TOTAL_NODES }}
  gpus_per_node: 4
  host_network: true
  host_ipc: true
  scheduling: device_plugin
  node_selector:
    cloud.google.com/gke-nodepool: ${{ variables.GKE_NODEPOOL }}
  # No usable in-pod RDMA NIC on A4X-max/GKE; MNNVL is P2P, not a NET transport.
  rdma: disable
  # The NVLink ComputeDomain: GKE's replacement for --segment=SEGMENT_NODES.
  compute_domain:
    create: true
  tolerations:
  - key: kubernetes.io/arch
    operator: Equal
    value: arm64
    effect: NoSchedule
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
  reservation:
    timeout: 1800
  collect_max_file_size: 1Gi
  collect_grace_seconds: 900

workflow:
  name: kimi_k3_trtllm_v1_0_3_gke_c64_swe_acc
  # ---- VERBATIM: setup.yaml workflow variables ----
  variables:
    HEAD_NODE_IP:
      value: ${{ backends.cluster.nodes[0].ip_address }}
    NODE_NAMES:
      value: ${{ backends.cluster.nodes | map(attribute='name') | join(',') }}
    FRONTEND_PORT:
      value: '8000'
    FRONTEND_NODE_IP:
      value: ${{ backends.cluster.nodes[variables.FRONTEND_NODE | int].ip_address
        }}
  tasks:
  # ---- setup.yaml preflight (D12) ----
  - name: preflight
    # GKE EDIT (D1): operator host (srun) -> server_cpu
    operator: server_cpu
    resources:
      nodes:
        indices:
        - 0
    # GKE EDIT (D12): depends_on fabric removed (fabric runs in the server pods)
    script:
