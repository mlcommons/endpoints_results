  # =======================================================================
  # CLIENT CONFIG -- point_36/client.yaml, VERBATIM content with
  # exactly TWO documented rewrites (SLURM_TO_GKE.md §5.1; --check enforces
  # that nothing else changed):
  #   1. report_dir: logs/qwen_agentic  ->  report_dir: ${REPORT_DIR}
  #      (durable node hostPath exported by the benchmark task; the task also
  #      passes --report-dir "${REPORT_DIR}", mirroring client.sh's --report-dir)
  #   2. settings.metrics_tokenizer_workers: 2  ->  32
  #      (GKE rule, F31: keep the silent end-of-run tokenizer drain short so the
  #      log stream / collect sentinel survive; the drop's own value is 2)
  # Comments cannot be added inside the block -- they would be part of the
  # artifact. endpoint_config.endpoints resolves via backends.cluster, which is
  # why the kubernetes backend below is named `cluster`.
  # =======================================================================
  - name: CLIENT_CONFIG
    uri: <workdir>
    content: |
      name: qwen-agentic-benchmark
      version: '1.0'
      type: online
      submission_ref:
        model: Qwen/Qwen3.6-35B-A3B
        ruleset: mlperf-endpoints-v1.0-2026-10-C1-A
      model_params:
        name: Qwen/Qwen3.6-35B-A3B
        tokenizer_name: ${{ variables.MODEL_PATH }}
        temperature: 1.0
        top_k: 20
        top_p: 0.95
        repetition_penalty: 1.0
        presence_penalty: 1.5
        max_new_tokens: 8192
        chat_template_kwargs:
          preserve_thinking: true
        streaming: 'on'
      datasets:
      - name: agentic_coding
        type: performance
        path: ${{ variables.DATASET_PATH }}
        accuracy_config:
          eval_method: agentic_inference_inline
        agentic_inference:
          turn_timeout_s: 14400.0
          enable_salt: true
          inject_tool_delay: true
          num_trajectories_to_issue: 2452
          stop_issuing_on_first_user_complete: false
      - name: swe_bench
        type: accuracy
        accuracy_config:
          eval_method: swe_bench_scorer
          num_repeats: 1
          extras:
            swebench_service_url: http://localhost:18080
            num_instances: 200
            workers: 10
            max_eval_workers: 10
            swebench_template: qwen_tools
      settings:
        metrics_isl: false
        runtime:
          max_issue_duration_ms: null
        early_stopping:
          enabled: false
        load_pattern:
          type: agentic_inference
          target_concurrency: ${{ variables.CONCURRENCY }}
        client:
          num_workers: 64
          log_level: INFO
          warmup_connections: 0
          auto_warmup_budget_fraction: 0.25
          max_concurrent_warmup_connects: 128
          max_connections: -1
          transport:
            type: zmq
            recv_buffer_size: 16777216
            send_buffer_size: 16777216
            io_threads: 4
            worker_io_threads: 1
            high_water_mark: 0
            linger: -1
            immediate: 1
          stream_all_chunks: false
          worker_initialization_timeout: 300.0
          worker_graceful_shutdown_wait: 0.5
          worker_force_kill_timeout: 0.5
          insecure: false
          max_idle_time: 0.5
          min_required_connections: -1
          worker_gc_mode: relaxed
        timeouts:
          service_ready_timeout_s: 300
          run_timeout_s: null
          performance_drain_timeout_s: null
          metrics_drain_timeout_s: null
        metrics_tokenizer_workers: 32
      endpoint_config:
        endpoints:
        - http://${{ backends.cluster.nodes[0].ip_address }}:${{ variables.PORT }}
        api_type: openai
        # The local server has no authentication. SWE's OpenAI adapter still
        # requires a nonempty placeholder for a non-loopback endpoint.
        api_key: EMPTY
      report_dir: ${REPORT_DIR}
      enable_cpu_affinity: true

  # =======================================================================
  # Shared helpers -- configs/_shared/{dynamo-server.py,dynamo_cpu_affinity.py,
  # cuda-compat.sh,autotune/GB300-NVL72.json}, BYTE-IDENTICAL (--check). Shipped
  # inline so they travel into the pod via ConfigMap; no repo checkout on the node.
  # =======================================================================
  - name: DYNAMO_LAUNCHER
    uri: <workdir>
    content: |
      #!/usr/bin/env python3
      """Four TP1 CentML workers behind Dynamo.

      One owned allocation, file discovery, session-affine routing (round-robin by default), and
      NUMA-local worker CPU sets. Preserve the image's vLLM/torch implementations.
      """
      import argparse
      import contextlib
      import csv
      import importlib.metadata
      import json
      import os
      from pathlib import Path
      import queue
      import shlex
      import signal
      import subprocess
      import sys
      import threading
      import time
      import traceback
      import urllib.error
      import urllib.request

      import yaml
      import dynamo_cpu_affinity as affinity

      # Log writing allowed after SIGTERM/SIGINT, before Slurm or sflow escalates to SIGKILL.
      SIGNAL_DRAIN_SECONDS = 20
      # Exit status of the launcher when any child's log sink failed, whatever else ended it (see finish_logs).
      LOG_SINK_FAILED_EXIT = 3


      def say(message, file=None):
          """print() to file (default: the current sys.stderr) that never raises: stdout and stderr are pipes into
          server.sh's tee, which may be gone. A broken stdout must not stop a healthy server."""
          try:
              print(message, file=file or sys.stderr, flush=True)
          except Exception:
              pass


      def engine_arguments(config):
          # HTTP-server settings belong to the Dynamo frontend, not AsyncEngineArgs.
          frontend = {'host', 'port', 'enable-auto-tool-choice', 'tool-call-parser',
                      'disable-uvicorn-access-log', 'enable-prompt-tokens-details'}
          args = []
          for key, value in config.items():
              if key in frontend:
                  continue
              if isinstance(value, bool):
                  args.append('--' + ('' if value else 'no-') + key)
              else:
                  args += ['--' + key, json.dumps(value) if isinstance(value, (dict, list)) else str(value)]
          return args


      def pump(source, log_path, prefix, out):
          """Copy a child's output lines to log_path and to out, prefixed, without letting the sinks block the child.

          The frontend writes its logs synchronously to stderr: if the pipe is not drained, it fills and the frontend
          stalls (CI C512 froze it for up to 3.65 s while Lustre writes stalled, failing requests on the 5 s TCP request
          timeout). The reader only moves lines from the pipe to an unbounded queue; the writer drains the queue in
          batches to the slow sinks (the Lustre log, and stdout, which server.sh tees to Lustre). Order is kept and no
          line is dropped while a sink works.

          A sink that raises (ENOSPC or EIO on the log, BrokenPipeError on stdout) is reported at once on stderr,
          recorded in progress['failed'] and not written again; the other sink still gets every line. With both
          failed, the writer keeps emptying the queue and counts the lines in progress['discarded'], so the queue
          stays short and the child is never blocked. progress also counts the lines 'read' from the pipe and
          'handled' by the writer. Returns (reader, writer, progress); the writer ends after it has handled
          everything read before end of file.
          """
          lines = queue.SimpleQueue()
          progress = {'read': 0, 'handled': 0, 'discarded': 0, 'failed': {}}

          def read():
              try:
                  for line in source:
                      progress['read'] += 1
                      lines.put(line)
              finally:
                  lines.put(None)

          def fail(sink, error, action):
              progress['failed'][sink] = repr(error)
              say(f'{prefix}{sink} sink failed {action}: {error!r}')

          def span(batch):
              return f'writing lines {progress["handled"] + 1}-{progress["handled"] + len(batch)}'

          def write():
              try:
                  log = open(log_path, 'w')
              except OSError as error:
                  log = None
                  fail('log', error, 'opening')
              stdout = out
              done = False
              while not done:
                  batch = [lines.get()]
                  while batch[-1] is not None:
                      try:
                          batch.append(lines.get_nowait())
                      except queue.Empty:
                          break
                  if batch[-1] is None:
                      batch.pop()
                      done = True
                  if not batch:
                      continue
                  if log is not None:
                      try:
                          log.writelines(batch)
                          log.flush()
                      except Exception as error:
                          fail('log', error, span(batch))
                          with contextlib.suppress(Exception):
                              log.close()
                          log = None
                  if stdout is not None:
                      try:
                          stdout.write(''.join(prefix + line for line in batch))
                          stdout.flush()
                      except Exception as error:
                          fail('stdout', error, span(batch))
                          stdout = None
                  if log is None and stdout is None:
                      progress['discarded'] += len(batch)
                  progress['handled'] += len(batch)
              if log is not None:
                  try:
                      log.close()
                  except Exception as error:
                      fail('log', error, 'closing')

          reader = threading.Thread(target=read, daemon=True)
          writer = threading.Thread(target=write, daemon=True)
          writer.start()
          reader.start()
          return reader, writer, progress


      def pipe_holders(inodes):
          """PIDs of other processes that still have one of the given pipes (by inode) open."""
          links = {f'pipe:[{inode}]' for inode in inodes}
          holders = set()
          for entry in Path('/proc').iterdir():
              if not entry.name.isdigit() or int(entry.name) == os.getpid():
                  continue
              try:
                  descriptors = list((entry / 'fd').iterdir())
              except OSError:
                  continue
              for descriptor in descriptors:
                  try:
                      if os.readlink(descriptor) in links:
                          holders.add(int(entry.name))
                          break
                  except OSError:
                      continue
          return holders


      def release(inodes):
          """SIGKILL every process still holding a child's output pipe once the children are gone.

          A reader only reaches end of file when every writer of the pipe has exited. Grandchildren inherit the pipe
          (vLLM's engine core, nsys's target): if a child exits or crashes first, or a grandchild ignores the
          process-group SIGTERM or has left the group, it keeps the pipe open and the reader would never finish.
          """
          if not inodes:
              return
          for pid in pipe_holders(inodes):
              try:
                  os.kill(pid, signal.SIGKILL)
              except ProcessLookupError:
                  pass


      def sink_failures(pumps):
          """One line per failed log sink: '[name] sink: error'."""
          return [f'[{name}] {sink}: {error}' for name, _, _, progress in pumps for sink, error in progress['failed'].items()]


      def drain(pumps, deadline=None):
          """Wait until each pump has read its pipe to end of file and handled every line, then report sink failures.

          deadline None (normal exit, the children are gone and their pipes released) waits as long as the sinks
          need. A time.monotonic() deadline (signal path) stops there and reports the lines left behind. Returns
          sink_failures(pumps); a writer that ended with lines unhandled counts as a failed 'writer' sink.
          """
          for name, reader, writer, progress in pumps:
              for thread in (reader, writer):
                  while thread.is_alive():
                      remaining = 1 if deadline is None else min(1, deadline - time.monotonic())
                      if remaining <= 0:
                          break
                      thread.join(remaining)  # In slices, so that a signal is handled promptly.
              unhandled = progress['read'] - progress['handled']
              if writer.is_alive():
                  say(f'[{name}] log writer behind at exit: {unhandled} of {progress["read"]} lines read not written'
                      + (', pipe still open' if reader.is_alive() else ''))
              elif unhandled:
                  progress['failed'].setdefault('writer', f'ended with {unhandled} lines unwritten')
              if progress['failed']:
                  say(f'[{name}] log sinks failed: {progress["failed"]}; {progress["discarded"]} of '
                      f'{progress["read"]} lines reached no sink')
          return sink_failures(pumps)


      def finish_logs(pumps, signalled):
          """Write the children's remaining output at shutdown; exit LOG_SINK_FAILED_EXIT if any log sink failed.

          Normal exit waits for the whole backlog; after SIGTERM/SIGINT, or a signal during that wait, it writes for
          at most SIGNAL_DRAIN_SECONDS. Without a sink failure it returns and the launcher's own exit stands (1 for an
          error such as a child exit, 128 + signal number for SIGTERM/SIGINT). With one it replaces that status by
          LOG_SINK_FAILED_EXIT, after printing the exception it replaces.
          """
          try:
              failed = drain(pumps, time.monotonic() + SIGNAL_DRAIN_SECONDS if signalled else None)
          except SystemExit:
              failed = drain(pumps, time.monotonic() + SIGNAL_DRAIN_SECONDS)
              if not failed:
                  raise
          if failed:
              error = sys.exc_info()[1]
              if error is not None and not isinstance(error, SystemExit):
                  say(''.join(traceback.format_exception(error)).rstrip())
              say(f'Dynamo log sinks failed, exiting {LOG_SINK_FAILED_EXIT}: ' + '; '.join(failed))
              raise SystemExit(LOG_SINK_FAILED_EXIT)


      def main():
          parser = argparse.ArgumentParser()
          parser.add_argument('--config', type=Path, required=True)
          parser.add_argument('--output', type=Path, required=True)
          parser.add_argument('--version', required=True)
          parser.add_argument('--ttl', type=int, default=3600)
          parser.add_argument('--frontend-cores', type=int, default=8)
          parser.add_argument('--client-cores', type=int, default=8)
          # Explicit point arguments override SERVER_EXTRA_ENV; session affinity applies in every mode.
          parser.add_argument('--router-mode', choices=('round-robin', 'least-loaded'),
                              default=os.environ.get('DYNAMO_ROUTER_MODE', 'round-robin'))
          args = parser.parse_args()
          nsys_enabled = os.environ.get('NSYS') == '1'
          if nsys_enabled:
              profile_delay = int(os.environ.get('NSYS_DELAY', '1200'))
              profile_duration = int(os.environ.get('NSYS_DURATION', '60'))
              if profile_delay < 0 or profile_duration <= 0:
                  raise ValueError('NSYS_DELAY must be nonnegative and NSYS_DURATION must be positive')
              # process-tree (default) or system-wide; system-wide needs one perf descriptor per CPU instead of one per CPU
              # per profiled thread, so it still samples where RLIMIT_NOFILE is too low for process-tree (for example 131072).
              # An explicit NSYS_ARGS replaces the whole option list, so the setting is then unused and not checked.
              nsys_cpu_sampling = os.environ.get('NSYS_CPU_SAMPLING') or 'process-tree'
              if not os.environ.get('NSYS_ARGS') and nsys_cpu_sampling not in ('process-tree', 'system-wide'):
                  raise ValueError(f'NSYS_CPU_SAMPLING must be process-tree or system-wide, got {nsys_cpu_sampling!r}')
          args.output.mkdir(parents=True, exist_ok=True)
          config = yaml.safe_load(args.config.read_text())
          # The server image must already contain the pinned Dynamo integration.
          if importlib.metadata.version('ai-dynamo') != args.version:
              raise RuntimeError(f'The server image must contain ai-dynamo=={args.version}')
          protected = {name: importlib.metadata.version(name) for name in ('vllm', 'torch', 'transformers')}
          devices = affinity.selected_devices(affinity.gpu_devices(), '')
          allowed = os.sched_getaffinity(0)
          plan, counts = affinity.allocation(devices, affinity.cores_by_numa(affinity.physical_cores(allowed), allowed),
                                              args.frontend_cores, args.client_cores)
          inventory = list(csv.reader(subprocess.check_output(['nvidia-smi', '--query-gpu=uuid,pci.bus_id',
                                                               '--format=csv,noheader'], text=True).splitlines()))
          uuids = {affinity.bdf(pci): uuid.strip() for uuid, pci in inventory}
          report = {'active_gpus': 4, 'workers': [{**gpu, 'uuid': uuids[gpu['pci']],
                     'cpus': affinity.rendered(plan['worker'][gpu['pci']])} for gpu in devices],
                    'frontend_cpus': affinity.rendered(plan['frontend']), 'client_cpus': affinity.rendered(plan['client']),
                    'physical_worker_cores': counts, 'protected_packages': protected}
          (args.output / 'dp4-topology.json').write_text(json.dumps(report, indent=2)+'\n')
          runtime = Path(os.environ['TMPDIR']) / 'qwen-dynamo'
          runtime.mkdir(parents=True, exist_ok=True)
          env = {**os.environ, 'DYN_DISCOVERY_BACKEND': 'file', 'DYN_FILE_KV': str(runtime),
                 'DYN_REQUEST_PLANE': 'tcp', 'DYN_EVENT_PLANE': 'zmq',
                 'DYN_TOKENIZER': 'fastokens', 'DYN_TOKENIZER_CACHE_BYTES': '8000000000'}
          # Direct Enroot omits HOME. Dynamo 1.4.2 then uses relative MDC blob
          # targets, producing broken tokenizer symlinks. Its supported fallback
          # must be absolute; keep HOME unchanged and caches on job scratch.
          if 'HOME' not in env:
              env['USERPROFILE'] = str(runtime.resolve())
          children, pumps, pipes = [], [], []
          signalled = False

          def start(name, command, mask, overrides):
              if name == 'vllm-worker-0' and nsys_enabled:
                  command += ['--enable-layerwise-nvtx-tracing', '--profiler-config', '{"profiler":"cuda"}']
                  nsys_options = os.environ.get('NSYS_ARGS') or f'''
                      --force-overwrite=true
                      --capture-range=cudaProfilerApi
                      --capture-range-end=repeat:1:async
                      --kill=none
                      --wait=primary
                      --trace=cuda,nvtx
                      --gpu-metrics-devices=all
                      --trace-fork-before-exec=true
                      --cuda-graph-trace=node
                      --sample={nsys_cpu_sampling}
                      --cpuctxsw={nsys_cpu_sampling}
                  '''
                  command = [
                      str(Path(os.environ['NSYS_DIR']) / 'nsys'),
                      'profile',
                      *shlex.split(nsys_options),
                      '--output=' + str(args.output / os.environ['NSYS_NAME']),
                      *command,
                  ]
              process = subprocess.Popen(['taskset', '-c', affinity.rendered(mask), *command],
                      env={**env, **overrides}, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                      text=True, start_new_session=True)
              children.append(process)
              pipes.append(os.fstat(process.stdout.fileno()).st_ino)
              pumps.append((name, *pump(process.stdout, args.output / f'{name}.log', f'[{name}] ', sys.stdout)))

          reported = set()

          def alive():
              # A failed log sink is reported but does not stop the server; finish_logs turns it into the exit status.
              for failure in sink_failures(pumps):
                  if failure not in reported:
                      reported.add(failure)
                      say(f'Dynamo log sink failed, server continues, launcher will exit {LOG_SINK_FAILED_EXIT}: {failure}')
              for process in children:
                  if process.poll() is not None:
                      raise RuntimeError(f'Dynamo process {process.pid} exited {process.returncode}')

          def terminate(signum, frame):
              nonlocal signalled
              signalled = True
              raise SystemExit(128 + signum)

          def profile(action):
              request = urllib.request.Request(f'http://127.0.0.1:18081/engine/control/{action}',
                  data=b'{}', headers={'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=float(os.environ.get('NSYS_CONTROL_TIMEOUT', 30))) as response:
                  result = json.load(response)
              if result.get('status') != 'ok':
                  raise RuntimeError(f'Nsys {action} failed: {result}')
              say(f'Nsys {action}: {result}', sys.stdout)

          signal.signal(signal.SIGTERM, terminate)
          signal.signal(signal.SIGINT, terminate)
          transport = ['--discovery-backend', 'file', '--request-plane', 'tcp', '--event-plane', 'zmq']
          profile_action = 'start_profile' if nsys_enabled else None
          profile_at = None
          try:
              start('dynamo-frontend', [sys.executable, '-m', 'dynamo.frontend', *transport,
                    '--router-mode', args.router_mode, '--router-session-affinity-ttl-secs', str(args.ttl),
                    '--http-host', '0.0.0.0', '--http-port', str(config['port']),
                    '--router-min-initial-workers', '4'], plan['frontend'], {'CUDA_VISIBLE_DEVICES': ''})
              for index, gpu in enumerate(devices):
                  cache = runtime / f'worker-{index}'
                  cache.mkdir()
                  start(f'vllm-worker-{index}', [sys.executable, '-m', 'dynamo.vllm', *transport,
                        '--dyn-tool-call-parser', 'qwen3_coder', '--dyn-reasoning-parser', 'qwen3',
                        *engine_arguments(config)], plan['worker'][gpu['pci']],
                        {'CUDA_VISIBLE_DEVICES': uuids[gpu['pci']], 'DYN_SYSTEM_PORT': str(18081+index),
                         'VLLM_CACHE_ROOT': str(cache/'vllm'), 'TRITON_CACHE_DIR': str(cache/'triton'),
                         'TORCHINDUCTOR_CACHE_DIR': str(cache/'inductor'), 'FLASHINFER_WORKSPACE_BASE': str(cache/'flashinfer')})
              deadline = time.monotonic() + 5100
              while True:
                  alive()
                  try:
                      for port in range(18081, 18085):
                          with urllib.request.urlopen(f'http://127.0.0.1:{port}/health', timeout=5) as response:
                              if response.status != 200:
                                  raise RuntimeError('Worker health is not ready')
                      request = urllib.request.Request(f'http://127.0.0.1:{config["port"]}/v1/chat/completions',
                          data=json.dumps({'model': config['served-model-name'], 'messages': [{'role': 'user', 'content': 'ping'}],
                                           'max_tokens': 1, 'chat_template_kwargs': {'preserve_thinking': True}}).encode(),
                          headers={'Content-Type': 'application/json'})
                      with urllib.request.urlopen(request, timeout=60) as response:
                          if not json.load(response).get('choices'):
                              raise RuntimeError('Readiness response has no choices')
                      break
                  except (urllib.error.URLError, TimeoutError, RuntimeError) as error:
                      detail = error.read().decode(errors='replace')[:2000] if isinstance(error, urllib.error.HTTPError) else str(error)
                      say(f'Dynamo readiness pending: {detail}', sys.stdout)
                      if time.monotonic() >= deadline:
                          raise RuntimeError('Dynamo readiness timed out') from error
                      time.sleep(10)
              say('DYNAMO_DP4_READY', sys.stdout)
              while True:
                  alive()
                  if profile_action is not None:
                      if profile_at is None and Path(os.environ['NSYS_START_FILE']).exists():
                          profile_at = time.monotonic() + profile_delay
                      if profile_at is not None and time.monotonic() >= profile_at:
                          profile(profile_action)
                          if profile_action == 'start_profile':
                              profile_action = 'stop_profile'
                              profile_at = time.monotonic() + profile_duration
                          else:
                              profile_action = None
                  time.sleep(2)
          finally:
              if profile_action == 'stop_profile':
                  try:
                      profile('stop_profile')
                  except Exception as error:
                      say(f'Nsys cleanup: {error}', sys.stdout)
              for process in children:
                  if process.poll() is None:
                      os.killpg(process.pid, signal.SIGTERM)
              for process in children:
                  try:
                      process.wait(timeout=20)
                  except subprocess.TimeoutExpired:
                      os.killpg(process.pid, signal.SIGKILL)
                      process.wait()
              # Grandchildren may still be writing their shutdown logs; after a grace period, release what is still held.
              grace = time.monotonic() + 5
              for _, reader, _, _ in pumps:
                  reader.join(max(0, grace - time.monotonic()))
              release([pipe for pipe, (_, reader, _, _) in zip(pipes, pumps) if reader.is_alive()])
              finish_logs(pumps, signalled)


      if __name__ == '__main__':
          main()
  - name: DYNAMO_CPU_AFFINITY
    uri: <workdir>
    content: |
      #!/usr/bin/env python3
      """Pin four Dynamo/vLLM workers and CPU roles to disjoint core sets.

      Inspect the CLI without changing any process affinity:
          python3 ci/engine/vllm/dynamo_cpu_affinity.py --help

      Within a four-GPU Slurm allocation, pin an existing frontend process:
          python3 ci/engine/vllm/dynamo_cpu_affinity.py --role frontend --pid <PID>
      """
      import argparse
      import csv
      import glob
      import json
      import os
      import subprocess
      from pathlib import Path


      def die(message):
          raise SystemExit(f"dynamo CPU affinity: {message}")


      def cpus(value):
          result = set()
          value = value.strip()
          if not value:
              return result
          for part in value.split(","):
              first, separator, last = part.partition("-")
              if not first or (separator and not last):
                  die(f"invalid CPU list {value!r}")
              try:
                  start, end = int(first), int(last or first)
              except ValueError:
                  die(f"invalid CPU list {value!r}")
              if end < start:
                  die(f"invalid CPU list {value!r}")
              result.update(range(start, end + 1))
          return result


      def rendered(value):
          return ",".join(map(str, sorted(value)))


      def bdf(value):
          domain, separator, address = value.strip().lower().partition(":")
          if not separator:
              die(f"invalid PCI address {value!r}")
          return f"{int(domain, 16):04x}:{address}"


      def gpu_devices():
          result = []
          for name in glob.glob("/sys/bus/pci/devices/*"):
              device = Path(name)
              if (device / "vendor").read_text().strip() != "0x10de" or not (device / "class").read_text().startswith("0x03"):
                  continue
              numa = int((device / "numa_node").read_text())
              result.append({"pci": device.name.lower(), "numa": numa})
          return sorted(result, key=lambda gpu: gpu["pci"])


      def selected_devices(devices, pci_list):
          if pci_list:
              selected_pci = [bdf(value) for value in pci_list.split(",") if value.strip()]
              if len(selected_pci) != 4 or len(set(selected_pci)) != 4:
                  die("--worker-gpu-pci must contain four distinct PCI addresses")
              selected = [gpu for gpu in devices if gpu["pci"] in selected_pci]
              if len(selected) != 4:
                  die("--worker-gpu-pci includes a GPU not visible in sysfs")
          elif len(devices) == 4:
              selected = devices
          else:
              die("host has more or fewer than four GPUs; set --worker-gpu-pci explicitly")
          if any(gpu["numa"] < 0 for gpu in selected):
              die("a selected GPU has no NUMA node")
          return sorted(selected, key=lambda gpu: gpu["pci"])


      def physical_cores(allowed):
          groups = {}
          for cpu in allowed:
              siblings = frozenset(cpus(Path(
                  f"/sys/devices/system/cpu/cpu{cpu}/topology/thread_siblings_list"
              ).read_text()))
              groups[siblings] = frozenset(siblings & allowed)
          return sorted(groups.values(), key=lambda group: min(group))


      def cores_by_numa(cores, allowed):
          cpu_nodes = {}
          for path in glob.glob("/sys/devices/system/node/node*/cpulist"):
              node = int(Path(path).parent.name.removeprefix("node"))
              for cpu in cpus(Path(path).read_text()) & allowed:
                  cpu_nodes[cpu] = node
          if set(cpu_nodes) != allowed:
              die("the Slurm cpuset includes CPUs without a NUMA node")
          result = {}
          for core in cores:
              nodes = {cpu_nodes[cpu] for cpu in core}
              if len(nodes) != 1:
                  die(f"hardware thread siblings cross NUMA nodes: {rendered(core)}")
              result.setdefault(nodes.pop(), []).append(core)
          return result


      def reserve(free, local_gpu_counts, count, role):
          candidates = [node for node in free
                        if len(free[node]) - count >= local_gpu_counts[node]]
          if not candidates:
              die(f"no GPU-local NUMA node has {count} physical cores for {role}")
          node = max(candidates, key=lambda item: (len(free[item]) / local_gpu_counts[item], -item))
          return frozenset().union(*[free[node].pop() for _ in range(count)])


      def allocation(devices, node_cores, frontend_cores, client_cores):
          free = {node: list(cores) for node, cores in node_cores.items()}
          local_gpu_counts = {node: sum(gpu["numa"] == node for gpu in devices) for node in free}
          free = {node: cores for node, cores in free.items() if local_gpu_counts[node]}
          plan, worker_counts = {"worker": {}}, {}
          plan["frontend"] = reserve(free, local_gpu_counts, frontend_cores, "frontend")
          plan["client"] = reserve(free, local_gpu_counts, client_cores, "client")
          for node in sorted({gpu["numa"] for gpu in devices}):
              local = [gpu for gpu in devices if gpu["numa"] == node]
              count, extra = divmod(len(free.get(node, [])), len(local))
              if count < 1:
                  die(f"NUMA node {node} has fewer physical cores than local GPUs")
              for position, gpu in enumerate(local):
                  worker_count = count + (position < extra)
                  plan["worker"][gpu["pci"]] = frozenset().union(
                      *[free[node].pop(0) for _ in range(worker_count)]
                  )
                  worker_counts[gpu["pci"]] = worker_count
          masks = list(plan["worker"].values()) + [plan["frontend"], plan["client"]]
          if any(not mask for mask in masks) or sum(map(len, masks)) != len(set().union(*masks)):
              die("worker, frontend, and client CPU sets overlap")
          return plan, worker_counts


      def worker_gpu(devices, cuda_visible):
          values = [value.strip() for value in cuda_visible.split(",") if value.strip()]
          if len(values) != 1:
              die(f"worker requires one CUDA_VISIBLE_DEVICES entry, got {cuda_visible!r}")
          rows = csv.reader(subprocess.check_output(
              ["nvidia-smi", "--query-gpu=index,uuid,pci.bus_id", "--format=csv,noheader"], text=True).splitlines())
          visible = []
          for index, uuid, pci in rows:
              visible.append({"index": int(index), "uuid": uuid.strip(), "pci": bdf(pci)})
          if len(visible) == 1:
              candidate = visible[0]
          else:
              matches = [gpu for gpu in visible if str(gpu["index"]) == values[0] or gpu["uuid"].startswith(values[0])]
              if len(matches) != 1:
                  die(f"CUDA_VISIBLE_DEVICES={values[0]!r} does not identify one visible GPU")
              candidate = matches[0]
          matches = [gpu for gpu in devices if gpu["pci"] == candidate["pci"]]
          if len(matches) != 1:
              die(f"CUDA-visible GPU {candidate['pci']} is not selected for this workflow")
          return {**matches[0], "index": candidate["index"], "uuid": candidate["uuid"]}


      def main():
          parser = argparse.ArgumentParser()
          parser.add_argument("--role", choices=("worker", "frontend", "client"), required=True)
          parser.add_argument("--worker-gpu-pci", default=os.environ.get("WORKER_GPU_PCI", ""))
          parser.add_argument("--frontend-cores", type=int, default=8)
          parser.add_argument("--client-cores", type=int, default=8)
          parser.add_argument("--gpu-visible")
          parser.add_argument("--pid", type=int)
          parser.add_argument("--report-dir", default=os.environ.get("SFLOW_WORKFLOW_OUTPUT_DIR", ""))
          parser.add_argument("command", nargs=argparse.REMAINDER)
          args = parser.parse_args()
          if args.command[:1] == ["--"]:
              args.command = args.command[1:]
          if bool(args.pid) == bool(args.command) or min(args.frontend_cores, args.client_cores) < 1:
              die("provide a command or --pid, and positive physical-core counts")
          allowed = os.sched_getaffinity(0)
          devices = selected_devices(gpu_devices(), args.worker_gpu_pci)
          plan, worker_counts = allocation(devices, cores_by_numa(physical_cores(allowed), allowed),
                                           args.frontend_cores, args.client_cores)
          gpu = worker_gpu(devices, args.gpu_visible or os.environ.get("CUDA_VISIBLE_DEVICES", "")) if args.role == "worker" else None
          selected, pid = plan["worker"][gpu["pci"]] if gpu else plan[args.role], args.pid or os.getpid()
          os.sched_setaffinity(pid, selected)
          if os.sched_getaffinity(pid) != selected:
              die("kernel did not apply the requested CPU set")
          report = {"pid": pid, "role": args.role, "cpus": rendered(selected), "gpu": gpu,
                    "workers": devices, "physical_core_counts": {"workers": worker_counts,
                    "frontend": args.frontend_cores,
                    "client": args.client_cores},
                    "plan": {"workers": {pci: rendered(mask) for pci, mask in plan["worker"].items()},
                    "frontend": rendered(plan["frontend"]), "client": rendered(plan["client"])}}
          print(json.dumps({"dynamo_cpu_affinity": report}, sort_keys=True), flush=True)
          if args.report_dir:
              directory = Path(args.report_dir) / "cpu-affinity"
              directory.mkdir(parents=True, exist_ok=True)
              (directory / f"{args.role}-{gpu['pci'] if gpu else args.role}.json").write_text(json.dumps(report, sort_keys=True) + "\n")
          if args.command:
              os.execvpe(args.command[0], args.command, os.environ)


      if __name__ == "__main__":
          main()
  - name: CUDA_COMPAT_SH
    uri: <workdir>
    content: |
      #!/usr/bin/env bash
      # Decide CUDA forward compatibility explicitly, inside the server container, then exec the command.
      #
      # NGC CUDA images ship a forward-compat libcuda under $_CUDA_COMPAT_PATH (/usr/local/cuda/compat; the real files in
      # lib.real, or lib) and normally let their entrypoint choose it. Pyxis/enroot launches skip that entrypoint, so
      # the choice is made here:
      #   - host kernel driver OLDER than the compat driver (CUDA_DRIVER_VERSION, e.g. a 580.x host driver vs a 615.x compat driver):
      #     put the compat libcuda first on LD_LIBRARY_PATH;
      #   - host driver the same or NEWER (e.g. a 620.x host driver): strip every compat entry, so the host libcuda is used
      #     (a newer host driver with the older compat libcuda fails CUDA init with error 803).
      # Nothing is baked into the image ENV. QWEN_DRIVER_VERSION_FILE / QWEN_HOST_DRIVER_VERSION override the host probe
      # (tests); the decision is printed to stderr and, if QWEN_CUDA_COMPAT_LOG is set, written there.
      set -euo pipefail
      compat_root="${_CUDA_COMPAT_PATH:-/usr/local/cuda/compat}"
      compat_version="${CUDA_DRIVER_VERSION:-}"
      host="${QWEN_HOST_DRIVER_VERSION:-}"
      if [[ -z "$host" ]]; then
        version_file="${QWEN_DRIVER_VERSION_FILE:-/proc/driver/nvidia/version}"
        if [[ -r "$version_file" ]]; then
          host="$(grep -oE 'Kernel Module( for [A-Za-z0-9_]+)? +[0-9]+(\.[0-9]+)+' "$version_file" | grep -oE '[0-9]+(\.[0-9]+)+$' | head -n1 || true)"
        fi
        if [[ -z "$host" ]] && command -v nvidia-smi > /dev/null 2>&1; then
          host="$(nvidia-smi --query-gpu=driver_version --format=csv,noheader 2>/dev/null | head -n1 || true)"
        fi
      fi
      compat_dir=""
      # lib.real = discrete/datacenter GPUs (GB300, VR200); lib.real-nvgpu is the integrated-GPU (nvgpu) variant, never used here.
      for candidate in "$compat_root/lib.real" "$compat_root/lib"; do
        if [[ -e "$candidate/libcuda.so.1" ]]; then compat_dir="$candidate"; break; fi
      done
      # Strip every compat entry first; the decision below may add exactly one back.
      kept=()
      IFS=':' read -r -a entries <<< "${LD_LIBRARY_PATH:-}"
      for entry in ${entries[@]+"${entries[@]}"}; do
        [[ -z "$entry" || "$entry" == "$compat_root"* || "$entry" == /usr/local/cuda*/compat* ]] && continue
        kept+=("$entry")
      done
      older() {  # older A B: version A < version B (numeric, dotted)
        awk -v a="$1" -v b="$2" 'BEGIN { n = split(a, x, "."); m = split(b, y, "."); k = (n > m ? n : m)
          for (i = 1; i <= k; i++) { if (x[i] + 0 < y[i] + 0) exit 0; if (x[i] + 0 > y[i] + 0) exit 1 }; exit 1 }'
      }
      if [[ -z "$host" ]]; then
        decision="host driver unknown: compat off"
      elif [[ -z "$compat_version" || -z "$compat_dir" ]]; then
        decision="host driver $host, no compat libcuda in the image: compat off"
      elif older "$host" "$compat_version"; then
        kept=("$compat_dir" ${kept[@]+"${kept[@]}"})
        decision="host driver $host < compat $compat_version: compat ON ($compat_dir)"
      else
        decision="host driver $host >= compat $compat_version: compat off"
      fi
      LD_LIBRARY_PATH="$(IFS=':'; printf '%s' "${kept[*]-}")"
      export LD_LIBRARY_PATH VLLM_ENABLE_CUDA_COMPATIBILITY=0
      printf 'cuda-compat: %s\n' "$decision" >&2
      if [[ -n "${QWEN_CUDA_COMPAT_LOG:-}" ]]; then
        printf '%s\nLD_LIBRARY_PATH=%s\n' "$decision" "$LD_LIBRARY_PATH" > "$QWEN_CUDA_COMPAT_LOG"
      fi
      exec "$@"
