# Point concurrency, Slurm resources, and task ordering.
version: '0.1'
variables:
  CONCURRENCY:
    value: 512
    type: integer
  QWEN_SHARED_DIR:
    value: ${{ variables.REPO_ROOT }}/NVIDIA/src/qwen3.6-35b-a3b/configs/_shared
    description: Common Dynamo and SWE runtime helpers.
  POINT_DIR:
    value: ${{ variables.REPO_ROOT }}/NVIDIA/src/qwen3.6-35b-a3b/configs/VR-NVL72_VR-288GB_aarch64x4_vLLM-Dynamo/point_512
    description: This point folder; run.sh sets its absolute path.
  SWE_SERVICE_PYTHON:
    value: python3
    description: Python environment with the pinned Endpoints SWE service already installed.
  MODE:
    value: perf
    description: Performance replay with inline accuracy; set both to add 200 SWE-bench instances after it, or acc for SWE-bench alone.
  SHARED_ROOT:
    value: <shared-run-storage-root>
    description: Writable shared root containing caches and run outputs; set --workspace-dir/--output-dir
      below this root.
  REPO_ROOT:
    value: <absolute-repository-root>
    description: Checkout on storage visible from the allocated node; set here once or override with --set
      REPO_ROOT=/absolute/path.
  SYSTEM_ID:
    value: VR-NVL72_VR-288GB_aarch64x4_vLLM-Dynamo
    description: Simple label for this hardware/configuration, set here once or override with --set SYSTEM_ID=...
      .
  RUN_LABEL:
    value: manual
    description: Unique output label; run.sh supplies a timestamp by default.
  RUN_DIR:
    value: ${{ variables.SHARED_ROOT }}/runs/${{ variables.SYSTEM_ID }}/c${{ variables.CONCURRENCY }}/${{
      variables.RUN_LABEL }}
  LOCAL_SCRATCH:
    value: ''
  MODEL_PATH:
    value: ${{ variables.SHARED_ROOT }}/models/Qwen3.6-35B-A3B
    description: Local BF16 source model matching dependencies.json.
  DATASET_PATH:
    value: ${{ variables.SHARED_ROOT }}/datasets/mlperf_agentic_inference_dataset.jsonl
    description: Local full Agentic Inference JSONL dataset matching dependencies.json.
  SERVER_IMAGE:
    value: ${{ variables.VR_NVL72_SERVER_IMAGE }}
    description: Pinned ARM64 source for the pre-imported SERVER_SQSH. It must be the Qwen image built from CentML/vllm
      VR_NVL72_VLLM_BRANCH at VR_NVL72_VLLM_COMMIT (dependencies.json); server.sh refuses an image whose VLLM_BUILD_COMMIT differs.
  SERVER_SQSH:
    value: ${{ variables.SHARED_ROOT }}/images/server-${{ variables.SERVER_IMAGE.split('@sha256:')[-1]
      }}.sqsh
  CLIENT_SQSH:
    value: ${{ variables.SHARED_ROOT }}/images/endpoints-${{ variables.CLIENT_IMAGE_DIGEST.split(':')[-1]
      }}.sqsh
  GPU_INDEX:
    value: 0
    type: integer
  CPUSET:
    value: ''
    description: Automatically use CPUs allowed by the allocation unless overridden.
  PORT:
    value: 30003
    type: integer
  SLURM_ACCOUNT:
    value: <slurm-account>
  SLURM_PARTITION:
    value: <slurm-partition>
  SLURM_TIME:
    value: 05:00:00
  MAX_NUM_BATCHED_TOKENS:
    value: 32768
    type: integer
    description: Also the largest CUDA-graph capture size in server.yaml.
  GS2_ROUTE_PREBUILT:
    value: ''
    description: Optional path of a prebuilt exact-routing FlashInfer MoE module (.so) for this configuration;
      empty JIT-builds it at start-up. Override with --set GS2_ROUTE_PREBUILT=/absolute/path.
  CLIENT_SLURM_PARTITION:
    value: ${{ variables.SLURM_PARTITION }}
  CLIENT_CPUS:
    value: 69
    type: integer
  CLIENT_JOB_NAME:
    value: qwen-${{ variables.RUN_LABEL }}-client
  GPU_UUID:
    value: ''
    description: DP1 GPU selection; automatically use the first visible GPU unless overridden.
  LOCAL_SCRATCH_ROOT:
    value: /tmp/qwen
    description: Owned node-local scratch root; CI supplies its approved site path.
  DP:
    value: 4
    type: integer
  STORAGE_ROOT:
    value: ${{ variables.SHARED_ROOT }}
    description: Container bind root containing checkout, model, dataset and run directories.
artifacts:
  SWE_CONNECTION:
    uri: <workdir>
    content: '{}'
  SWE_LAUNCHER:
    uri: <workdir> variables.QWEN_SHARED_DIR }}/swe-service.py
  DYNAMO_LAUNCHER:
    uri: <workdir> variables.QWEN_SHARED_DIR }}/dynamo-server.py
backends:
  cluster:
    type: slurm
    default: true
    account: ${{ variables.SLURM_ACCOUNT }}
    partition: ${{ variables.SLURM_PARTITION }}
    time: ${{ variables.SLURM_TIME }}
    nodes: 1
    gpus_per_node: 4
    extra_args:
    - --exclusive
    - --ntasks-per-node=1
    - --chdir=${{ variables.SHARED_ROOT }}
  client_cpu:
    type: slurm
    account: ${{ variables.SLURM_ACCOUNT }}
    partition: ${{ variables.CLIENT_SLURM_PARTITION }}
    time: ${{ variables.SLURM_TIME }}
    nodes: 1
    gpus_per_node: 0
    extra_args:
    - --exclusive
    - --cpus-per-task=${{ variables.CLIENT_CPUS }}
    - --job-name=${{ variables.CLIENT_JOB_NAME }}
    - --chdir=${{ variables.SHARED_ROOT }}
operators:
  node:
    type: srun
    nodes: 1
    ntasks: 1
    overlap: true
    cpus_per_task: 352
    chdir: ${{ variables.SHARED_ROOT }}
    extra_args:
    - --cpu-bind=none
  client_host:
    type: srun
    nodes: 1
    ntasks: 1
    cpus_per_task: ${{ variables.CLIENT_CPUS }}
    overlap: true
    extra_args:
    - --cpu-bind=none
    - --chdir=${{ variables.SHARED_ROOT }}
workflow:
  name: VR-NVL72_VR-288GB_aarch64x4_vLLM-Dynamo-c512
  tasks:
  - name: swe_service
    operator: client_host
    script:
    - exec bash "$QWEN_SHARED_DIR/swe-service.sh"
    probes:
      readiness:
        log_watch:
          regex_pattern: SWE_READY
        timeout: 1800
    backend: client_cpu
  - name: serve_endpoint
    operator: node
    script:
    - exec bash "$POINT_DIR/server.sh"
    probes:
      readiness:
        log_watch:
          regex_pattern: DYNAMO_DP4_READY
        timeout: 5400
    backend: cluster
  - name: benchmark_0
    operator: client_host
    depends_on:
    - serve_endpoint
    - swe_service
    script:
    - exec bash "$POINT_DIR/client.sh"
    backend: client_cpu
