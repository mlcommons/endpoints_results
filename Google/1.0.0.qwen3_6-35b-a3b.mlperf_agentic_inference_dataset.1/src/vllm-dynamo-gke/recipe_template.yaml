version: "0.1"

# ============================================================================
# Qwen3.6-35B-A3B -- MLPerf Endpoints v1.0.3 point C@@CONCURRENCY@@
# 4 x TP1 vLLM workers behind one Dynamo frontend, ONE GB300 node, GKE A4X-max
# ============================================================================
# GENERATED by ../../generate_point_recipes.py from ../../recipe_template.yaml
# -- do not hand-edit. Fix the template or the generator and regenerate.
#
# GKE port of the NVIDIA Slurm recipe:
#   nv-mlpinf-partner-partner-endpoints-v1.0.3/NVIDIA/src/qwen3.6-35b-a3b/
#     configs/dependencies.json                      (version pins)
#     configs/_shared/dynamo-server.py               (VERBATIM -> DYNAMO_LAUNCHER artifact)
#     configs/_shared/dynamo_cpu_affinity.py         (VERBATIM -> DYNAMO_CPU_AFFINITY artifact)
#     configs/_shared/cuda-compat.sh                 (VERBATIM -> CUDA_COMPAT_SH artifact)
#     configs/_shared/autotune/GB300-NVL72.json      (VERBATIM -> AUTOTUNE_JSON artifact)
#     configs/@@SYSTEM_ID@@/point_@@CONCURRENCY@@/
#       server.yaml    -> SERVER_ENV + SERVER_CONFIG artifacts, BYTE-IDENTICAL content
#       client.yaml    -> CLIENT_CONFIG artifact, content + 2 documented rewrites
#       server.sh      -> serve_endpoint script (model/runtime lines verbatim)
#       client.sh      -> benchmark script (model/runtime lines verbatim)
#       workflow.yaml  -> CONCURRENCY, probes, topology cross-check
#
# Ported per ../../../../SLURM_TO_GKE.md. The split (§1):
#
#   MODEL / WORKLOAD half -- copied VERBATIM from the drop:
#     every vLLM engine flag and SERVER_ENV kernel/GDN/FlashInfer setting
#     (server.yaml), the Dynamo launcher (4 x TP1 dynamo.vllm workers,
#     session-affine frontend, file discovery, tcp request plane, zmq event
#     plane, NUMA-local worker CPU sets), cuda-compat.sh, the GB300 FlashInfer
#     autotune seed file, the runtime env of server.sh / client.sh, the whole
#     client.yaml workload (submission_ref, sampling params, agentic_inference
#     block, num_trajectories_to_issue @@TRAJECTORIES@@, swe_bench block, client
#     transport, timeouts), CONCURRENCY and the readiness/failure probes.
#
#   FABRIC / CONTAINER / LAUNCHER half -- the GKE layer, NOT the Slurm one:
#     srun + Pyxis/Enroot          -> kubernetes backend, one pod per task
#     client_cpu Slurm allocation  -> client pod on node CLIENT_NODE_INDEX
#                                     (0 = co-located; see CLIENT_RESERVE_NODES)
#     shared storage ($SHARED_ROOT)-> node-local SSD hostPaths, staged on EVERY
#                                     node by ../../stage-assets.yaml
#     --report-dir on shared FS    -> durable node hostPath REPORTS_DIR + mirror
#     swe_service (Pyxis)          -> NOT PORTED; MODE=perf default (see below)
#
# TOPOLOGY (identical to Slurm, SLURM backends.cluster.nodes = @@SLURM_NODES@@):
#   @@DP@@ workers x TP@@TP@@ = @@TOTAL_GPUS@@ GPUs = @@SERVER_NODES@@ node(s) of @@GPUS_PER_NODE@@ GB300 GPUs.
#
# COMPUTE DOMAIN / MNNVL: DELIBERATELY OFF. Every worker is TP1 on its own GPU
# and no request ever crosses a GPU (aggregated serving, no disaggregated KV,
# no TP/EP collective, one node). There is nothing for a ComputeDomain / IMEX
# channel / NCCL MNNVL to carry, so `compute_domain` is omitted, the
# IMEX_CHANNELS mount is omitted, and NCCL_MNNVL_ENABLE / MC_FORCE_MNNVL are
# NOT exported (forcing MNNVL without an IMEX channel is itself a failure
# mode). The §5.6 UCX_* / OMPI_* / TRTLLM_* block is TRT-LLM-disagg plumbing
# and is likewise not used. What IS kept from §5.5/§5.6: host_network (the
# client reaches the Dynamo frontend at the node IP, exactly the endpoint
# client.yaml names), rdma: disable, eth0 socket pinning, sysctls.
#
# BEFORE YOU RUN (../../README.md §3) -- on EVERY node of the pool:
#   kubectl apply -f ../../stage-assets.yaml     # model @ @@MODEL_REVISION_SHORT@@ + dataset
#   kubectl apply -f ../../mk-report-dir.yaml    # durable REPORTS_DIR
#   kubectl apply -f ../../prepull-images.yaml   # server image is private
# On Kubernetes a missing fs:// path is only a WARNING; both tasks hard-fail
# on missing or wrong-revision assets instead.
# ============================================================================

variables:
  # ---------------------------------------------------------------------
  # POINT -- from configs/@@SYSTEM_ID@@/point_@@CONCURRENCY@@/workflow.yaml.
  # Do not edit; regenerate.
  # ---------------------------------------------------------------------
  CONCURRENCY:
    description: "Total client concurrency (the point number). Read by client.yaml target_concurrency."
    type: integer
    value: @@CONCURRENCY@@
  DP:
    description: "Dynamo workers (one TP1 vLLM engine per GPU). Slurm workflow.yaml DP."
    type: integer
    value: @@DP@@
  MAX_NUM_BATCHED_TOKENS:
    description: "vLLM max-num-batched-tokens and the top CUDA-graph capture size (server.yaml)."
    type: integer
    value: @@MAX_NUM_BATCHED_TOKENS@@
  PORT:
    description: "Dynamo frontend HTTP port on the node (server.yaml `port`, client.yaml endpoint)."
    type: integer
    value: @@PORT@@
  SYSTEM_ID:
    description: "NVIDIA system label; used in the launcher's cache path and nsys name."
    value: @@SYSTEM_ID@@
  MODE:
    description: >-
      perf | acc | both. NVIDIA's default is `@@DROP_MODE@@`; the GKE default is `perf`
      because the Pyxis SWE-bench service is not ported (see header). acc/both
      need SWE_SERVICE_URL and the swe-service-token Secret.
    value: perf

  # ---------------------------------------------------------------------
  # PINS -- from configs/dependencies.json. Do not edit; regenerate.
  # ---------------------------------------------------------------------
  MODEL_REPOSITORY:
    description: "HF repo of the BF16 source model (online MXFP8 quantization in vLLM)."
    value: "@@MODEL_REPOSITORY@@"
  MODEL_REVISION:
    description: "Pinned 40-char revision. Read by server.yaml; checked against the node's .sflow-staged marker."
    value: "@@MODEL_REVISION@@"
  DATASET_SHA256:
    description: "sha256 of the unchanged 613-trajectory agentic JSONL. The benchmark task hard-fails on a mismatch."
    value: "@@DATASET_SHA256@@"
  DYNAMO_VERSION:
    description: "ai-dynamo version the launcher insists on (dynamo-server.py --version)."
    value: "@@DYNAMO_VERSION@@"
  VLLM_BRANCH:
    description: "CentML vLLM branch built into SERVER_IMAGE (dependencies.json VLLM_BRANCH)."
    value: "@@VLLM_BRANCH@@"
  VLLM_COMMIT:
    description: "Pinned 40-char CentML vLLM commit checked against VLLM_BUILD_COMMIT in server.sh."
    value: "@@VLLM_COMMIT@@"
  ENDPOINTS_REVISION:
    description: "mlcommons/endpoints commit of the client image. Report it with every result."
    value: "@@ENDPOINTS_REVISION@@"
  SERVER_IMAGE:
    description: >-
      Partner-registry CentML vLLM (@@VLLM_BRANCH@@ @ @@VLLM_COMMIT@@) + ai-dynamo
      @@DYNAMO_VERSION@@ build, pinned by the digest in dependencies.json
      (GB300_SERVER_IMAGE; Pyxis `host#path` form rewritten to a registry reference).
      linux/arm64 per the drop README. PRIVATE: create the `gitlab-partner-registry`
      docker-registry Secret, or mirror it into Artifact Registry KEEPING THE DIGEST
      and pass -s SERVER_IMAGE=<mirror>@sha256:...
    value: @@SERVER_IMAGE@@
  SERVER_IMAGE_PULL_SECRET:
    description: "imagePullSecret for SERVER_IMAGE. A missing Secret is ignored by kubelet (fine for a mirror)."
    value: gitlab-partner-registry
  CLIENT_IMAGE:
    description: >-
      MLCommons Endpoints client, pinned by dependencies.json CLIENT_IMAGE_DIGEST.
      @@CLIENT_IMAGE_NOTE@@
    value: @@CLIENT_IMAGE@@
  CLIENT_IMAGE_DIGEST:
    description: "dependencies.json CLIENT_IMAGE_DIGEST (multi-arch index digest). Recorded in client-image.txt."
    value: "@@CLIENT_IMAGE_DIGEST@@"
  SERVER_VENV:
    description: >-
      Optional. Python environment in SERVER_IMAGE that imports dynamo + vllm. Empty =
      auto-detect (VIRTUAL_ENV, /opt/dynamo/venv, /opt/venv, UV_PROJECT_ENVIRONMENT,
      then PATH). Needed because sflow starts containers with `bash -l`, which
      resets PATH (SLURM_TO_GKE.md F16).
    value: ""

  # ---------------------------------------------------------------------
  # GKE SITE -- replaces the Slurm site variables (SHARED_ROOT, REPO_ROOT,
  # SLURM_ACCOUNT/PARTITION, STORAGE_ROOT, LOCAL_SCRATCH_ROOT). -s NAME=value.
  # ---------------------------------------------------------------------
  K8S_NAMESPACE:
    description: "Namespace for every pod in the run."
    value: default
  GKE_NODEPOOL:
    description: "cloud.google.com/gke-nodepool of the A4X-max (arm64, 4 x GB300) pool."
    value: <nodepool>
  GPUS_PER_NODE:
    description: "GB300 / A4X-max: 4 GPUs per host (Slurm gpus_per_node)."
    type: integer
    value: @@GPUS_PER_NODE@@
  SERVER_NODES:
    description: "Nodes the Dynamo server uses -- Slurm backends.cluster.nodes."
    type: integer
    value: @@SERVER_NODES@@
  CLIENT_RESERVE_NODES:
    description: >-
      0 (default) = the client pod shares node 0 with the server (REQUIRED_NODES=1).
      1 = reserve one more node just for the client, the closest GKE analogue of
      Slurm's separate client_cpu allocation (@@CLIENT_CPUS@@ CPUs). The endpoints client
      pins its workers across every online CPU (enable_cpu_affinity: true), so when
      co-located it shares cores with the vLLM workers. Launch with
      CLIENT_RESERVE_NODES=1 ./launch_test.sh (the node gate then needs 2 nodes).
    type: integer
    value: 0
  TOTAL_NODES:
    type: integer
    value: ${{ variables.SERVER_NODES + variables.CLIENT_RESERVE_NODES }}
  CLIENT_NODE_INDEX:
    type: integer
    value: ${{ variables.TOTAL_NODES - 1 }}

  MODEL_PATH:
    description: "@@MODEL_REPOSITORY@@ @ @@MODEL_REVISION@@ on each node's local SSD. Read by server.yaml and client.yaml."
    value: <node-local-ssd>/model-cache/@@MODEL_DIRNAME@@
  DATA_ROOT:
    description: "Node-local dataset directory (hostPath-mounted; the directory, never the file)."
    value: <node-local-ssd>/mlperf-data
  DATASET_PATH:
    description: "The agentic JSONL, drop file name. Read by client.yaml."
    value: ${{ variables.DATA_ROOT }}/@@DATASET_FILENAME@@
  REPORTS_ROOT:
    description: "Durable per-node report root. Must pre-exist: ../../mk-report-dir.yaml."
    value: <node-local-ssd>/qwen3.6-35b-a3b-reports
  SHARED_ROOT:
    description: >-
      Writable root referenced by SERVER_ENV for compiled GDN/FlashInfer/EWS kernel
      caches (${{ variables.SHARED_ROOT }}/caches/qwen-gb300/*). Pointed at
      REPORTS_ROOT on the node SSD so compiled kernels persist across runs on a node.
    value: ${{ variables.REPORTS_ROOT }}
  QWEN_SHARED_DIR:
    description: >-
      In-container directory where _shared helpers (dynamo-server.py,
      dynamo_cpu_affinity.py, cuda-compat.sh, autotune/GB300-NVL72.json) are staged.
      Referenced by SERVER_ENV VLLM_FLASHINFER_AUTOTUNE_FILE and server.sh.
    value: /tmp/qwen-shared
  HF_CACHE_DIR:
    description: "HF_HOME. Slurm puts it on shared storage; here it is container-local (HF is offline for perf)."
    value: /tmp/qwen-hf-cache
  CACHE_ROOT:
    description: >-
      Replaces Slurm's $SHARED_ROOT/caches root in server.sh. Container-local: the
      launcher gives every worker its own cache dir under TMPDIR anyway.
    value: /tmp/qwen-caches

  # ---------------------------------------------------------------------
  # Server-side knobs carried from workflow.yaml / server.sh (defaults as in the drop).
  # ---------------------------------------------------------------------
  GPU_UUID:
    description: "DP1 GPU selection; empty = first visible GPU (server.sh)."
    value: ""
  CPUSET:
    description: "Empty = CPUs allowed to the process (server.sh / client.sh)."
    value: ""
  NSYS:
    description: "1 = nsys-profile worker 0 (needs NSYS_DIR in the image). Off, as in the drop."
    value: "0"
  NSYS_DIR:
    value: ""
  SERVER_EXTRA_ENV:
    description: "Optional space-separated NAME=value pairs for the Dynamo frontend and vLLM workers (server.sh)."
    value: ""

  # ---------------------------------------------------------------------
  # Accuracy (acc/both only). The token is NEVER a variable: it comes from
  # the `swe-service-token` Secret (key `token`) as SWE_SERVICE_TOKEN.
  # ---------------------------------------------------------------------
  SWE_SERVICE_URL:
    description: "Externally hosted swebench_service base URL, reachable from the client pod. Empty = none."
    value: ""

  FABRIC_STRICT:
    description: >-
      1 (default) = abort the server if this node's four GPUs do not report a
      healthy, completed NVLink fabric (SLURM_TO_GKE.md §7.3 / F19); kubelet shows
      such a node Ready. CUDA init on NVL72 hosts depends on fabric registration
      even for TP1. 0 = warn and continue.
    value: "1"

artifacts:
  # =======================================================================
  # SERVER ENV + SERVER CONFIG -- point_@@CONCURRENCY@@/server.yaml,
  # BYTE-IDENTICAL content. generate_point_recipes.py --check parses both and
  # requires string equality. ${{ }} expressions resolve against the variables
  # above (SHARED_ROOT, QWEN_SHARED_DIR, MODEL_PATH, MODEL_REVISION, PORT,
  # MAX_NUM_BATCHED_TOKENS), as on Slurm.
  # =======================================================================
  - name: SERVER_ENV
    uri: <workdir>
    content: |
@@SERVER_ENV_BLOCK@@

  - name: SERVER_CONFIG
    uri: <workdir>
    content: |
@@SERVER_CONFIG_BLOCK@@

  # =======================================================================
  # CLIENT CONFIG -- point_@@CONCURRENCY@@/client.yaml, VERBATIM content with
  # exactly TWO documented rewrites (SLURM_TO_GKE.md §5.1; --check enforces
  # that nothing else changed):
  #   1. report_dir: logs/qwen_agentic  ->  report_dir: ${REPORT_DIR}
  #      (durable node hostPath exported by the benchmark task; the task also
  #      passes --report-dir "${REPORT_DIR}", mirroring client.sh's --report-dir)
  #   2. settings.metrics_tokenizer_workers: 2  ->  32
  #      (GKE rule, F31: keep the silent end-of-run tokenizer drain short so the
  #      log stream / collect sentinel survive; the drop's own value is 2)
  # Comments cannot be added inside the block -- they would be part of the
  # artifact. endpoint_config.endpoints resolves via backends.cluster, which is
  # why the kubernetes backend below is named `cluster`.
  # =======================================================================
  - name: CLIENT_CONFIG
    uri: <workdir>
    content: |
@@CLIENT_CONFIG_BLOCK@@

  # =======================================================================
  # Shared helpers -- configs/_shared/{dynamo-server.py,dynamo_cpu_affinity.py,
  # cuda-compat.sh,autotune/GB300-NVL72.json}, BYTE-IDENTICAL (--check). Shipped
  # inline so they travel into the pod via ConfigMap; no repo checkout on the node.
  # =======================================================================
  - name: DYNAMO_LAUNCHER
    uri: <workdir>
    content: |
@@DYNAMO_SERVER_PY_BLOCK@@
  - name: DYNAMO_CPU_AFFINITY
    uri: <workdir>
    content: |
@@DYNAMO_CPU_AFFINITY_PY_BLOCK@@
  - name: CUDA_COMPAT_SH
    uri: <workdir>
    content: |
@@CUDA_COMPAT_SH_BLOCK@@
  - name: AUTOTUNE_JSON
    uri: <workdir>
    content: |
@@AUTOTUNE_JSON_BLOCK@@

  # GKE port of the fabric half of NVIDIA/src/kimi-k3/scripts/checks.py (as in
  # the v1.0.0 Kimi-K3 GKE recipes). Stdlib only.
  - name: FABRIC_CHECK
    uri: <workdir>
    content: |
      #!/usr/bin/env python3
      """Validate this node's four GB300s report a healthy NVLink fabric."""
      import os
      import re
      import socket
      import subprocess
      import sys


      def fabric_identity(text):
          blocks = re.split(r'(?m)^GPU ', text)[1:]
          if len(blocks) != 4:
              raise ValueError(f'Expected four physical GPUs per node, saw {len(blocks)}')
          identities = []
          for block in blocks:
              if '\n    Fabric\n' not in block:
                  raise ValueError('Missing GPU fabric report')
              fabric = block.split('\n    Fabric\n', 1)[1]
              for key, expected in (('State', 'Completed'), ('Status', 'Success'),
                                    ('Summary', 'Healthy'), ('Bandwidth', 'Full')):
                  match = re.search(r'(?m)^\s+' + key + r'\s+:\s*(\S+)', fabric)
                  if not match or match[1] != expected:
                      raise ValueError(f'Unhealthy or incomplete GPU fabric: {key}')
              identity = []
              for key in ('ClusterUUID', 'CliqueId'):
                  match = re.search(key + r'\s+:\s*(\S+)', fabric)
                  if not match or match[1] == 'N/A':
                      raise ValueError(f'Missing fabric identity: {key}')
                  identity.append(match[1])
              identities.append(identity)
          if any(value != identities[0] for value in identities):
              raise ValueError('Node GPUs have different fabric identities')
          return identities[0]


      def main():
          node = os.environ.get('SFLOW_TASK_NODE_NAME') or socket.gethostname().split('.')[0]
          strict = os.environ.get('FABRIC_STRICT', '1') == '1'
          try:
              text = subprocess.check_output(['nvidia-smi', '-q'], text=True, timeout=60)
              cluster_uuid, clique_id = fabric_identity(text)
          except Exception as exc:
              print(f'QWEN_FABRIC node={node} FAILED: {exc}', flush=True)
              if strict:
                  print(f'QWEN_FABRIC ABORTING (FABRIC_STRICT=1). Cordon the node and re-run:\n'
                        f'    kubectl cordon {node}\n'
                        f'  To continue anyway: -s FABRIC_STRICT=0', flush=True)
                  sys.exit(1)
              print('QWEN_FABRIC warning only (FABRIC_STRICT=0); continuing', flush=True)
              return
          print(f'QWEN_FABRIC node={node} cluster={cluster_uuid} clique={clique_id} '
                f'gpus=4 healthy=True', flush=True)


      if __name__ == '__main__':
          main()

  # fs:// = hostPath window onto the node's own SSD, NOT a fetch. sflow mounts
  # every fs:// artifact into every task pod. Mount directories only: a missing
  # FILE path would be created as a directory by the runtime.
  - name: MODEL_CACHE
    uri: fs://${{ variables.MODEL_PATH }}
  - name: MLPERF_DATA
    uri: fs://${{ variables.DATA_ROOT }}
  # Durable results + server logs + compiled kernel caches (SLURM_TO_GKE.md §5.8 / F29 / F31).
  - name: REPORTS_DIR
    uri: fs://${{ variables.REPORTS_ROOT }}

operators:
  # Slurm `server` operator (srun + Pyxis, container_writable, remap_root).
  - name: server
    type: k8s
    image: ${{ variables.SERVER_IMAGE }}
    image_pull_secrets:
      - ${{ variables.SERVER_IMAGE_PULL_SECRET }}
    shm_size: 64Gi
    run_as_root: true
    security_context:
      privileged: true
  # Slurm `client` operator (srun + Pyxis, CLIENT_IMAGE@CLIENT_IMAGE_DIGEST).
  - name: client
    type: k8s
    image: ${{ variables.CLIENT_IMAGE }}
    shm_size: 16Gi
    run_as_root: true
    env:
      - name: SWE_SERVICE_TOKEN
        valueFrom:
          secretKeyRef:
            name: swe-service-token
            key: token
            optional: true

backends:
  # Named `cluster` ON PURPOSE: the verbatim client.yaml endpoint is
  # http://${{ backends.cluster.nodes[0].ip_address }}:${{ variables.PORT }}.
  - name: cluster
    type: kubernetes
    default: true
    namespace: ${{ variables.K8S_NAMESPACE }}
    nodes: ${{ variables.TOTAL_NODES }}
    gpus_per_node: ${{ variables.GPUS_PER_NODE }}
    # pod IP == node IP: the Dynamo frontend listens on node0:PORT, which is
    # exactly the endpoint client.yaml names.
    host_network: true
    host_ipc: true
    scheduling: device_plugin
    node_selector:
      cloud.google.com/gke-nodepool: ${{ variables.GKE_NODEPOOL }}
    # No NET transport is needed (no cross-GPU traffic at all); `disable` keeps
    # NCCL/UCX from probing dead RoCE HCAs and adds no RDMA device mounts.
    rdma: disable
    # compute_domain: intentionally absent -- see the header.
    tolerations:
      - key: "kubernetes.io/arch"
        operator: "Equal"
        value: "arm64"
        effect: "NoSchedule"
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
    reservation:
      timeout: 1800
    # Default 10 MiB silently skips report files (F30); events.jsonl is excluded
    # from the mirror instead.
    collect_max_file_size: 1Gi
    collect_grace_seconds: 900

workflow:
  name: qwen36-35b-a3b-gke-dynamo-c@@CONCURRENCY@@
  tasks:
    # =====================================================================
    # serve_endpoint -- Slurm task of the same name (server.sh). One pod, all
    # four GPUs of node 0, running the drop's Dynamo launcher unchanged:
    # 1 x dynamo.frontend + 4 x dynamo.vllm (TP1), file discovery.
    # =====================================================================
    - name: serve_endpoint
      operator: server
      resources:
        nodes:
          indices: [0]
        gpus:
          count: ${{ variables.GPUS_PER_NODE }}
      script:
        - set -euo pipefail
        # ---- GKE: resolve the server interpreter (bash -l resets PATH, F16).
        - |
          SERVER_PY=""
          for d in "${{ variables.SERVER_VENV }}" "${VIRTUAL_ENV:-}" /opt/dynamo/venv /opt/venv "${UV_PROJECT_ENVIRONMENT:-}"; do
            [ -n "${d}" ] && [ -x "${d}/bin/python3" ] || continue
            if "${d}/bin/python3" -c 'import dynamo, vllm, yaml' 2>/dev/null; then
              export PATH="${d}/bin:${PATH}"; SERVER_PY="${d}/bin/python3"; break
            fi
          done
          if [ -z "${SERVER_PY}" ] && python3 -c 'import dynamo, vllm, yaml' 2>/dev/null; then
            SERVER_PY="$(command -v python3)"
          fi
          if [ -z "${SERVER_PY}" ]; then
            echo "FATAL: no python3 in SERVER_IMAGE imports dynamo+vllm+yaml; set -s SERVER_VENV=<venv>" >&2
            exit 1
          fi
          echo "server interpreter: ${SERVER_PY}"
        # ---- GKE: fail fast on MODE before loading anything.
        - |
          case "${{ variables.MODE }}" in
            perf) ;;
            acc|both)
              if [ -z "${{ variables.SWE_SERVICE_URL }}" ]; then
                echo "FATAL: MODE=${{ variables.MODE }} needs -s SWE_SERVICE_URL=... (+ swe-service-token Secret);" >&2
                echo "  the Pyxis SWE-bench service is not ported to GKE (../../README.md section 5)." >&2
                exit 2
              fi ;;
            *) echo "MODE must be perf, acc, or both" >&2; exit 2 ;;
          esac
        # ---- GKE: hard-fail on missing / wrong-revision weights (fs:// is only
        # ---- a plan-time warning). Replaces server.sh's STORAGE_ROOT checks.
        - |
          M="${{ artifacts.MODEL_CACHE.path }}"
          fail=0
          for f in config.json tokenizer_config.json model.safetensors.index.json; do
            [ -s "${M}/${f}" ] || { echo "MISSING ${M}/${f}" >&2; fail=1; }
          done
          got_rev="$(cat "${M}/.sflow-staged" 2>/dev/null || true)"
          if [ "${got_rev}" != "${{ variables.MODEL_REVISION }}" ]; then
            echo "MISSING/STALE: ${M}/.sflow-staged='${got_rev}', want ${{ variables.MODEL_REVISION }}" >&2; fail=1
          fi
          if [ "${fail}" != 0 ]; then
            echo "Stage the model on every node: kubectl apply -f ../../stage-assets.yaml. Refusing to run." >&2
            exit 1
          fi
          echo "model OK: ${M} @ ${got_rev}"
        # ---- GKE: NVLink fabric preflight (F19).
        - export FABRIC_STRICT="${{ variables.FABRIC_STRICT }}"
        - '"${SERVER_PY}" ${{ artifacts.FABRIC_CHECK.path }}'
        # ---- GKE layer (§5.6, the subset that applies to 4 x TP1 on one node).
        - sysctl -w net.core.rmem_max=134217728 2>/dev/null || true
        - sysctl -w net.core.wmem_max=134217728 2>/dev/null || true
        - sysctl -w net.ipv4.tcp_rmem="4096 87380 134217728" 2>/dev/null || true
        - sysctl -w net.ipv4.tcp_wmem="4096 65536 134217728" 2>/dev/null || true
        - export LD_LIBRARY_PATH="/usr/local/nvidia/lib64:${LD_LIBRARY_PATH:-}"
        - export GLOO_SOCKET_IFNAME=eth0 TP_SOCKET_IFNAME=eth0 NCCL_SOCKET_IFNAME=eth0
        # ---- GKE: container /etc/profile.d exports NCCL_ENV_PLUGIN=gcp and
        # ---- NCCL_NET_PLUGIN=gcp under `bash -l`, overriding sflow's pod-level
        # ---- rdma:disable env. Disable the GCP plugin and use Socket on single-node DP4.
        - export NCCL_NET=Socket NCCL_ENV_PLUGIN=none NCCL_NET_PLUGIN=none
        # ---- Variables server.sh reads from the Slurm environment.
        - |
          export MODE="${{ variables.MODE }}" DP="${{ variables.DP }}" CONCURRENCY="${{ variables.CONCURRENCY }}"
          export SYSTEM_ID="${{ variables.SYSTEM_ID }}" DYNAMO_VERSION="${{ variables.DYNAMO_VERSION }}"
          export VLLM_BRANCH="${{ variables.VLLM_BRANCH }}" VLLM_COMMIT="${{ variables.VLLM_COMMIT }}"
          export SERVER_IMAGE="${{ variables.SERVER_IMAGE }}" HF_CACHE_DIR="${{ variables.HF_CACHE_DIR }}"
          export GPU_UUID="${{ variables.GPU_UUID }}" CPUSET="${{ variables.CPUSET }}"
          export NSYS="${{ variables.NSYS }}" NSYS_DIR="${{ variables.NSYS_DIR }}"
          export SERVER_CONFIG="${{ artifacts.SERVER_CONFIG.path }}" SERVER_ENV="${{ artifacts.SERVER_ENV.path }}"
          export SERVER_EXTRA_ENV="${{ variables.SERVER_EXTRA_ENV }}"
          export SHARED_ROOT="${{ variables.SHARED_ROOT }}" CACHE_ROOT="${{ variables.CACHE_ROOT }}"
          mkdir -p \
            "${SHARED_ROOT}/caches/qwen-gb300/gsc-build" \
            "${SHARED_ROOT}/caches/qwen-gb300/gdn-conv-build" \
            "${SHARED_ROOT}/caches/qwen-gb300/fi-moe-modules" \
            "${SHARED_ROOT}/caches/qwen-gb300/ews-build"
        # ---- Durable server output (worker logs, dp4-topology.json, resolved
        # ---- server.yaml/server.env): REPORTS_DIR/<run-id>/serve_endpoint on the
        # ---- node SSD. Replaces server.sh's $SFLOW_TASK_OUTPUT_DIR, which is an
        # ---- emptyDir here that an `exec`'d service task never collects.
        - |
          SERVER_OUT="${{ artifacts.REPORTS_DIR.path }}/$(basename "${SFLOW_WORKFLOW_OUTPUT_DIR}")/serve_endpoint"
          mkdir -p "${SERVER_OUT}"
          echo "QWEN_SERVER_DIR node=${SFLOW_TASK_NODE_NAME:-$(hostname)} path=${SERVER_OUT}"
        # ---- Stage _shared/ helpers into QWEN_SHARED_DIR (dynamo-server.py,
        # ---- dynamo_cpu_affinity.py, cuda-compat.sh, autotune/GB300-NVL72.json).
        - |
          QWEN_SHARED_DIR="${{ variables.QWEN_SHARED_DIR }}"
          rm -rf "${QWEN_SHARED_DIR}"
          mkdir -p "${QWEN_SHARED_DIR}/autotune"
          cp ${{ artifacts.DYNAMO_LAUNCHER.path }} "${QWEN_SHARED_DIR}/dynamo-server.py"
          cp ${{ artifacts.DYNAMO_CPU_AFFINITY.path }} "${QWEN_SHARED_DIR}/dynamo_cpu_affinity.py"
          cp ${{ artifacts.CUDA_COMPAT_SH.path }} "${QWEN_SHARED_DIR}/cuda-compat.sh"
          chmod +x "${QWEN_SHARED_DIR}/cuda-compat.sh"
          cp ${{ artifacts.AUTOTUNE_JSON.path }} "${QWEN_SHARED_DIR}/autotune/GB300-NVL72.json"
          export QWEN_SHARED_DIR DYNAMO_LAUNCHER="${QWEN_SHARED_DIR}/dynamo-server.py"
        # ==== server.sh (point_@@CONCURRENCY@@), model/runtime lines VERBATIM ====
        # Dropped: the placeholder / STORAGE_ROOT / --workspace-dir checks (Slurm
        # site plumbing, replaced by the asset checks above). Rewritten site
        # paths only: $SHARED_ROOT/caches -> CACHE_ROOT, $SFLOW_TASK_OUTPUT_DIR
        # -> SERVER_OUT (durable).
        - |
@@SERVER_SH_BLOCK@@
      probes:
        # workflow.yaml serve_endpoint probes, verbatim.
        failure:
          log_watch:
            regex_pattern: @@SERVER_FAILURE_REGEX@@
        readiness:
          log_watch:
            regex_pattern: @@SERVER_READY_REGEX@@
          timeout: @@SERVER_READY_TIMEOUT@@

    # =====================================================================
    # benchmark -- Slurm task `benchmark_0` (client.sh), renamed so the run
    # layout matches SLURM_TO_GKE.md §10 (<run>/benchmark/, <run>/report/).
    # SLURM_TO_GKE.md §5.8 pattern: venv before env scrub, hard-fail on
    # assets, durable REPORT_DIR printed early, NO exec, mirror back.
    # =====================================================================
    - name: benchmark
      operator: client
      resources:
        nodes:
          indices:
            - ${{ variables.CLIENT_NODE_INDEX }}
      depends_on:
        - serve_endpoint
      script:
        - set -euo pipefail
        # ---- §5.8.1 resolve the client venv BEFORE scrubbing env (F16).
        - |
          CLIENT_VENV="${UV_PROJECT_ENVIRONMENT:-/opt/venv}"
          if [ -x "${CLIENT_VENV}/bin/python3" ]; then
            export PATH="${CLIENT_VENV}/bin:${PATH}"
          fi
        - unset PYTHONPATH PYTHONHOME UV_PROJECT_ENVIRONMENT
        - |
          echo "client interpreter: $(command -v python3)"
          if ! python3 -c 'import inference_endpoint, yaml' 2>/dev/null || [ ! -x /opt/venv/bin/inference-endpoint ]; then
            echo "FATAL: inference_endpoint / /opt/venv/bin/inference-endpoint not available ($(command -v python3))." >&2
            echo "  CLIENT_IMAGE=${{ variables.CLIENT_IMAGE }}" >&2
            exit 1
          fi
        # ---- MODE / accuracy-service consistency.
        - |
          export MODE="${{ variables.MODE }}"
          case "${MODE}" in
            perf) ;;
            acc|both)
              if [ -z "${{ variables.SWE_SERVICE_URL }}" ] || [ -z "${SWE_SERVICE_TOKEN:-}" ]; then
                echo "FATAL: MODE=${MODE} needs -s SWE_SERVICE_URL=... and the swe-service-token Secret." >&2
                exit 2
              fi ;;
            *) echo "MODE must be perf, acc, or both" >&2; exit 2 ;;
          esac
        # ---- §5.8.2 hard-fail on missing assets: the client tokenizes with
        # ---- MODEL_PATH and would otherwise run against a missing dataset.
        - |
          M="${{ artifacts.MODEL_CACHE.path }}"
          D="${{ variables.DATASET_PATH }}"
          ALIAS="${{ variables.DATA_ROOT }}/agentic_combined_v6.jsonl"
          if [ ! -s "${D}" ] && [ -s "${ALIAS}" ] && [ "$(sha256sum "${ALIAS}" | cut -d' ' -f1)" = "${{ variables.DATASET_SHA256 }}" ]; then
            cp "${ALIAS}" "${D}.tmp.$$" && mv "${D}.tmp.$$" "${D}"
          fi
          fail=0
          for f in config.json tokenizer_config.json; do
            [ -s "${M}/${f}" ] || { echo "MISSING ${M}/${f}" >&2; fail=1; }
          done
          if [ ! -s "${D}" ]; then
            echo "MISSING dataset ${D}" >&2; fail=1
          else
            got="$(sha256sum "${D}" | cut -d' ' -f1)"
            if [ "${got}" != "${{ variables.DATASET_SHA256 }}" ]; then
              echo "CORRUPT dataset ${D}: sha256 ${got} != ${{ variables.DATASET_SHA256 }}" >&2; fail=1
            else
              echo "dataset OK: ${D} sha256=${got}"
            fi
          fi
          if [ "${fail}" != 0 ]; then
            echo "Stage the assets on every node: kubectl apply -f ../../stage-assets.yaml. Refusing to run." >&2
            exit 1
          fi
        # ---- §5.8.4 durable REPORT_DIR, printed early.
        - |
          export REPORT_DIR="${{ artifacts.REPORTS_DIR.path }}/$(basename "${SFLOW_WORKFLOW_OUTPUT_DIR}")/report"
          mkdir -p "${REPORT_DIR}"
          echo "QWEN_REPORT_DIR node=${SFLOW_TASK_NODE_NAME:-$(hostname)} path=${REPORT_DIR}"
        # ---- Provenance snapshot (small; collected with the task output).
        - |
          mkdir -p "${SFLOW_TASK_OUTPUT_DIR}"
          cat > "${SFLOW_TASK_OUTPUT_DIR}/provenance.txt" <<EOF_PROV
          point               : C${{ variables.CONCURRENCY }}
          system              : ${{ variables.SYSTEM_ID }} (GKE A4X-max)
          topology            : ${{ variables.DP }} x TP1 dynamo.vllm, ${{ variables.SERVER_NODES }} server node(s), client node index ${{ variables.CLIENT_NODE_INDEX }}
          mode                : ${{ variables.MODE }}
          model               : ${{ variables.MODEL_REPOSITORY }} @ ${{ variables.MODEL_REVISION }}
          dataset sha256      : ${{ variables.DATASET_SHA256 }}
          server image        : ${{ variables.SERVER_IMAGE }}
          vllm build          : ${{ variables.VLLM_BRANCH }} @ ${{ variables.VLLM_COMMIT }}
          client image        : ${{ variables.CLIENT_IMAGE }}
          endpoints revision  : ${{ variables.ENDPOINTS_REVISION }}
          dynamo version      : ${{ variables.DYNAMO_VERSION }}
          client.yaml rewrites: report_dir -> \${REPORT_DIR}; metrics_tokenizer_workers 2 -> 32
          EOF_PROV
          cat "${SFLOW_TASK_OUTPUT_DIR}/provenance.txt"
        # ---- Accuracy-service connection for client.sh's runtime edit: the
        # ---- Slurm SWE_CONNECTION json, built from the URL + Secret instead.
        - |
          umask 077
          export SWE_CONNECTION="$(mktemp /tmp/swe-connection.XXXXXX.json)"
          SWE_SERVICE_URL_VALUE="${{ variables.SWE_SERVICE_URL }}" python3 - "${SWE_CONNECTION}" <<'PY_CONN'
          import json, os, sys
          url = os.environ.get('SWE_SERVICE_URL_VALUE', '')
          token = os.environ.get('SWE_SERVICE_TOKEN', '')
          json.dump({'url': url, 'token': token} if url else {}, open(sys.argv[1], 'w'))
          PY_CONN
        - export CLIENT_CONFIG="${{ artifacts.CLIENT_CONFIG.path }}" HF_CACHE_DIR="${{ variables.HF_CACHE_DIR }}"
        - export CPUSET="${{ variables.CPUSET }}" NSYS="${{ variables.NSYS }}"
        - export CLIENT_IMAGE="${{ variables.CLIENT_IMAGE }}" CLIENT_IMAGE_DIGEST="${{ variables.CLIENT_IMAGE_DIGEST }}"
        # ==== client.sh (point_@@CONCURRENCY@@), model/runtime lines VERBATIM ====
        # Dropped: SLURM_JOB_ID / SLURMD_NODENAME exports (Slurm only). The final
        # `exec inference-endpoint ...` runs WITHOUT exec (F29) and with
        # --report-dir "${REPORT_DIR}" instead of $SFLOW_TASK_OUTPUT_DIR/report.
        - |
@@CLIENT_SH_BLOCK@@
        # ---- Benchmark (no exec) -> redact the SWE token like swe-service.py's
        # ---- finally-block -> mirror small report files -> real exit code.
        - |
          python3 - "$SFLOW_TASK_OUTPUT_DIR/client.yaml" <<'PY_SHOW'
          import os, sys
          text, token = open(sys.argv[1]).read(), os.environ.get('SWE_SERVICE_TOKEN', '')
          print('runtime client.yaml:\n' + (text.replace(token, '<redacted>') if token else text))
          PY_SHOW
          set +e
          /opt/venv/bin/inference-endpoint benchmark from-config \
            -c "$SFLOW_TASK_OUTPUT_DIR/client.yaml" --report-dir "${REPORT_DIR}" --mode "$MODE"
          rc=$?
          set -e
          echo "benchmark exit code: ${rc}"
          if [ -n "${SWE_SERVICE_TOKEN:-}" ]; then
            python3 - "${SFLOW_WORKFLOW_OUTPUT_DIR}" "${REPORT_DIR}" <<'PY_REDACT' || true
          import os, sys
          from pathlib import Path
          token = os.environ['SWE_SERVICE_TOKEN']
          for root in sys.argv[1:]:
              for pattern in ('*.yaml', '*.yml', '*.json'):
                  for path in Path(root).rglob(pattern):
                      try:
                          if path.stat().st_size > 64 * 2**20:
                              continue
                          text = path.read_text()
                      except (OSError, UnicodeDecodeError):
                          continue
                      if token in text:
                          path.write_text(text.replace(token, '<redacted>'))
          PY_REDACT
          fi
          rm -f "${SWE_CONNECTION}"
          DEST="${SFLOW_WORKFLOW_OUTPUT_DIR}/report"
          mkdir -p "${DEST}"
          ( cd "${REPORT_DIR}" \
            && find . -type f ! -name 'events.jsonl' -print0 \
               | tar cf - --null -T - ) 2>/dev/null \
            | ( cd "${DEST}" && tar xf - ) 2>/dev/null || true
          echo "mirrored report -> ${DEST}:"
          ls -la "${DEST}" || true
          echo "durable copy retained on node at ${REPORT_DIR}"
          exit "${rc}"
      probes:
        # workflow.yaml benchmark_0 failure probe, verbatim.
        failure:
          log_watch:
            regex_pattern: @@CLIENT_FAILURE_REGEX@@
