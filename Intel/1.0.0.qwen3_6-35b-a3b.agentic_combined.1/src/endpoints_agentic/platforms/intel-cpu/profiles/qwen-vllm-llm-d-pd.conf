# Opt-in six-NUMA-node P/D profile using the llm-d routing stack.
RUNTIME_ADAPTER="vllm_pd"
ROUTING_ADAPTER="llm_d"
TOPOLOGY_MODE="pd"
PREFILL_TP_SIZE=1
PREFILL_REPLICA_COUNT=3
DECODE_TP_SIZE=1
DECODE_REPLICA_COUNT=3
# Optional fixed aggregate KV cache per prefill/decode worker. Omit for adaptive sizing.
# PREFILL_KV_CACHE_PER_WORKER_GIB=<positive integer>
# DECODE_KV_CACHE_PER_WORKER_GIB=<positive integer>
CALIBRATION_SUPPORTED=true

# Derived locally from the catalog-pinned stock vLLM CPU image.
RUNTIME_IMAGE="${VLLM_PD_IMAGE}"
RUNTIME_BASE_IMAGE="${VLLM_CPU_IMAGE}"
RUNTIME_DOCKERFILE="platforms/intel-cpu/docker/Dockerfile.vllm-pd"

# ghcr.io/llm-d/llm-d-router-endpoint-picker:v0.10.0, linux/amd64
ROUTING_IMAGE="ghcr.io/llm-d/llm-d-router-endpoint-picker@sha256:9862ae38658824b2560c547237363fe21f269e649b873a4ee84fe3137b554ba9"
ROUTING_IMAGE_DISPLAY_TAG="ghcr.io/llm-d/llm-d-router-endpoint-picker:v0.10.0"
# docker.io/envoyproxy/envoy:distroless-v1.33.2, linux/amd64
ROUTING_PROXY_IMAGE="docker.io/envoyproxy/envoy@sha256:0d8c8b3fc3250b5f664dd93ac305738f9c4e6ff38fcb8499088cca1b827f787e"
ROUTING_PROXY_IMAGE_DISPLAY_TAG="docker.io/envoyproxy/envoy:distroless-v1.33.2"
# ghcr.io/llm-d/llm-d-router-disagg-sidecar:v0.10.0, linux/amd64
LLMD_SIDECAR_IMAGE="ghcr.io/llm-d/llm-d-router-disagg-sidecar@sha256:1344adff65f96f76fc00c6003a1c63c1e9bb70f3628307f61f748a89a265b260"
LLMD_SIDECAR_IMAGE_DISPLAY_TAG="ghcr.io/llm-d/llm-d-router-disagg-sidecar:v0.10.0"
LLMD_SIDECAR_PORT_OFFSET=1000
MODEL_NAME="Qwen/Qwen3.6-35B-A3B-FP8"
PUBLIC_ENDPOINT_PORT=30000
WORKER_BASE_PORT=8870
NIXL_SIDE_CHANNEL_BASE_PORT=5660

LLMD_SESSION_TTL_SECONDS=86400
