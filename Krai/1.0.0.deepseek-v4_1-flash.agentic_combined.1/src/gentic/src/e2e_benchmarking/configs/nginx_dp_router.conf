worker_processes auto;
error_log /logs/nginx_dp_router_error.log warn;
events { worker_connections 16384; }
http {
  log_format dp '$msec $http_x_session_id $dp_rank $status $request_time';
  access_log /logs/nginx_dp_router.log dp;
  split_clients "${http_x_session_id}" $dp_rank {
@DP_SPLIT@
  }
  upstream vllm {
    server 127.0.0.1:@SERVER_PORT@;
    keepalive 512;
  }
  server {
    listen @ROUTER_PORT@;
    location / {
      proxy_pass http://vllm;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-data-parallel-rank $dp_rank;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
      client_max_body_size 0;
    }
  }
}