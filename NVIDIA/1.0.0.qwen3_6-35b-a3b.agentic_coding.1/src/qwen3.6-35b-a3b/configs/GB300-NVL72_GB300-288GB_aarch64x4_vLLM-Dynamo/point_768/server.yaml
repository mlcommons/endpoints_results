# Complete vLLM settings for this point. Version pins come from dependencies.json.
version: '0.1'
artifacts:
  SERVER_ENV:
    uri: file://server.env
    content: |
      # Server environment for every worker (read by server.sh). Only values that differ from the vLLM defaults at VLLM_COMMIT.
      # CUDA-graph capture hardening
      CFIX=1
      CFIX_RESET=1
      # GDN deferred state commit
      GDN_STATE_COMMIT=1
      GDN_STATE_COMMIT_BUILD_DIR=${{ variables.SHARED_ROOT }}/caches/qwen-gb300/gsc-build
      GDN_STATE_COMMIT_GB=1
      GDN_STATE_COMMIT_GB_QO=1
      GDN_STATE_COMMIT_MINB=4
      # GDN step plan and spec/prefill overlap
      GGM=1
      GGM_LAZY=1
      GGM_MDCHECK=300
      GGM_MDREUSE=1
      GGM_OG2=1
      GGM_VSDIRECT=1
      VLLM_GDN_FUSED_MD=1
      # GDN layer graphs
      VLLM_GDNP_SPEC_OVERLAP=2
      VLLM_GDN_LAYER_GRAPHS=1
      VLLM_GDN_LAYER_GRAPHS_DEVICE_NB=1
      VLLM_GDN_LAYER_GRAPHS_MODE=layer
      VLLM_GDN_LAYER_GRAPHS_TPH=4
      VLLM_GDN_LAYER_GRAPHS_VSF_KEY=1
      # GDN conv and chunked prefill
      GDN_CONV_CUDA_BUILD_DIR=${{ variables.SHARED_ROOT }}/caches/qwen-gb300/gdn-conv-build
      GDN_CONV_CUDA_MIXED_ADD=0
      VLLM_GDN_CONV_CUDA=1
      VLLM_GDN_FI_CP_POOL=1
      VLLM_GDN_FI_VSPLIT=1
      VLLM_GDN_FI_VSPLIT_V1=1
      VLLM_GDN_VSPLIT_C1REORDER=1
      VLLM_GDN_VSPLIT_CG0SPLIT=1
      # KV copy, prefix cache and Mamba checkpoints
      VLLM_FUSED_KV_BLOCK_COPY_MULTI=1
      VLLM_FUSED_KV_BLOCK_COPY_TABLE_CACHE=1
      VLLM_MAMBA_DROP_SUPERSEDED_STATE=1
      VLLM_MAMBA_PIN_OWN_CKPT=1
      VLLM_SUFFIX_TOKEN_STAGING=256
      # Norm/quant fusion and MoE
      F121=1
      GS2_ROUTE=1
      GS2_ROUTE_LOG=1
      GS2_ROUTE_MAXN=11520
      GS2_ROUTE_TAG=gs2r3
      LCD2_BF16=tiny
      LCD2_PDL=1
      NQF=1
      QGF_FIN=1
      SEG_FOLD=1
      VLLM_FLASHINFER_MOE_ROUTING_MODULE_CACHE=${{ variables.SHARED_ROOT }}/caches/qwen-gb300/fi-moe-modules
      VLLM_MOE_FINALIZE_FOLD_MAX_M=1000000
      VLLM_SEG_MODE=scale
      # Elementwise and glue kernels
      EWS=1
      EWS_QKV_TPP=2
      GLUE_EWS_CUDA=1
      GLUE_EWS_CUDA_BUILD_DIR=${{ variables.SHARED_ROOT }}/caches/qwen-gb300/ews-build
      GLUE_EWS_CUDA_MIN_T=1024
      GLUE_EWS_CUDA_PDL=1
      GLUE_EWS_CUDA_PW_MIN_T=256
      GLUE_EWS_NOGATE=1
      GLUE_EWS_TPP_SPLIT=1024
      GLUE_FNQ_F0=1
      GLUE_FNQ_XB=1
      GLUE_GMRR=1
      GLUE_GNQ_CFG=1,2048
      GLUE_GSC_QO=1
      GLUE_LAZY=1
      GLUE_NQRR=1
      # Attention (prefill routing, decode split-KV, prefill/decode overlap)
      FI_DECODE_SPLITKV=auto
      FMHA107=1
      FMHA107_F107=0
      FMHA107_LOG=1
      FMHA107_MIN_KV=0
      FMHA107_MIN_TOKENS=512
      FMHA_GEN=1
      FMHA_GEN_RULE=gb300
      VLLM_ATTN_PD_OVERLAP=1
      VLLM_ATTN_PD_WAVE_GATE=1
      # Programmatic dependent launch
      LCD_FI_OVERLAY=1
      LCD_PDL_TRITON=1
      PFW=1
      PFWS=1
      PFWS_TRIG=1
      PFW_TRIG=1
      # Spec decode and sampling
      VLLM_MTP_DRAFT_PREFILL_PRUNE=1
      VLLM_SAMPLER_GRAPH=1
      VLLM_SAMPLER_GRAPH_PRECAPTURE=1-8
      VLLM_SAMPLER_GRAPH_PRECAPTURE_PARAMS=temperature=1.0,top_k=20,top_p=0.95,presence_penalty=1.5
      VLLM_SAMPLER_STATE_DIRTY=1
      VLLM_SPARSE_VERIFY_SAMPLING=1
      # Engine host path
      FEH=1
      VLLM_FEH_MEMO=1
      # FlashInfer autotune: seed the (fresh, per-run) cache with this system's pinned file
      VLLM_FLASHINFER_AUTOTUNE_FILE=${{ variables.QWEN_SHARED_DIR }}/autotune/GB300-NVL72.json
  SERVER_CONFIG:
    content: |
      model: ${{ variables.MODEL_PATH }}
      dtype: bfloat16
      quantization: mxfp8
      quantization-config:
        ignore:
        - re:^(?:model\.)?visual(?:\..*)?$
        - re:(?:.*\.)?lm_head$
        - re:(?:.*\.)?embed_tokens$
        - re:.*\.(?:input_layernorm|post_attention_layernorm)$
        - re:.*\.mlp\.(?:gate|shared_expert_gate)$
        - re:.*\.linear_attn\.(?:A_log|conv1d|dt_bias|in_proj_a|in_proj_b|in_proj_ba|norm)$
        - re:.*\.self_attn\.(?:k_norm|q_norm)$
        - re:(?:.*\.)?mtp\.(?:fc|norm|pre_fc_norm_embedding|pre_fc_norm_hidden)$
      revision: ${{ variables.MODEL_REVISION }}
      served-model-name: Qwen/Qwen3.6-35B-A3B
      host: 0.0.0.0
      port: ${{ variables.PORT }}
      trust-remote-code: true
      seed: 42
      max-model-len: 262144
      gpu-memory-utilization: 0.9
      enable-prefix-caching: true
      mamba-ssm-cache-dtype: float32
      language-model-only: true
      limit-mm-per-prompt:
        image: 0
        video: 0
      enable-auto-tool-choice: true
      tool-call-parser: qwen3_xml
      reasoning-parser: qwen3
      enable-prompt-tokens-details: true
      max-num-batched-tokens: ${{ variables.MAX_NUM_BATCHED_TOKENS }}
      max-num-seqs: 256
      moe-backend: flashinfer_trtllm
      speculative-config:
        method: qwen3_next_mtp
        num_speculative_tokens: 3
      tensor-parallel-size: 1
      data-parallel-size: 1
      kv-cache-dtype: fp8
      async-scheduling: true
      enable-chunked-prefill: true
      attention-backend: flashinfer
      disable-uvicorn-access-log: true
      # GB300 stack: partial-tail GDN checkpoints at 32 tokens (PMU32) and the
      # FlashInfer GDN prefill backend; the capture list above has 163 sizes (ends at MNBT).
      prefix-match-unit: 32
      additional-config:
        gdn_prefill_backend: flashinfer
      compilation-config:
