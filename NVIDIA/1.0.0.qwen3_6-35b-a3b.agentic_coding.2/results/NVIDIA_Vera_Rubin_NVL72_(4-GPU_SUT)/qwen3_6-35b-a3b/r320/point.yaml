model_notes: Online MXFP8 from the published BF16 checkpoint, using the pinned image
  implementation and its recorded quantization exclusions. The target model's lm_head
  stays BF16. The MTP drafter computes its draft logits with an MXFP8 copy of that
  BF16 lm_head, quantized once at load without calibration data, when a draft step
  has at most 128 rows (VLLM_MTP_DRAFT_LM_HEAD_MXFP8=1, VLLM_MTP_DRAFT_LM_HEAD_MXFP8_MAX_M=128),
  and with the BF16 lm_head when it has more; the target verifies every draft token
  with its BF16 lm_head.
